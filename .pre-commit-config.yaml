repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: end-of-file-fixer
        exclude: ^\.github/workflows/.*\.(lock\.yml|md)$
      - id: trailing-whitespace
        exclude: ^\.github/workflows/.*\.(lock\.yml|md)$
      - id: check-yaml
      - id: check-json
        exclude: ^.*invalid.*\.json$
      - id: check-xml
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: f12edd9c7be1c20cfa42420fd0e6df71e42b51ea # frozen: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or:
          - java
          - markdown
        additional_dependencies:
          - prettier@3.9.9
          - prettier-plugin-java@2.11.0
        exclude: ^\.github/workflows/.*\.(lock\.yml|md)$
  - repo: https://github.com/sirosen/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049 # frozen: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-actions
      - id: check-github-workflows
        exclude: ^\.github/workflows/.*\.lock\.yml$
  - repo: https://github.com/returntocorp/semgrep
    rev: fed96460fd67f504ea59342eba8f921f4d74fe17 # frozen: v1.179.0
    hooks:
      - id: semgrep
        types_or:
          - java
          - xml
        args: ["--config", ".semgrep.yaml", "--error", "--metrics=off"]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        exclude: '^\.github/workflows/.*\.lock\.yml$'
