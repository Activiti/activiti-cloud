name: Load Maven shard config
description: Resolve shard build/test settings from .github/ci/maven-shards.json (single matrix dimension in workflows).
inputs:
  shard-id:
    description: Maven shard identifier (core, runtime-bundle, …)
    required: true

outputs:
  maven-modules:
    description: Maven -pl modules for build
    value: ${{ steps.load.outputs.maven_modules }}
  docker-images:
    description: Comma-separated Docker image make targets (may be empty)
    value: ${{ steps.load.outputs.docker_images }}
  maven-test-modules:
    description: Maven -pl modules for test (when roots empty)
    value: ${{ steps.load.outputs.maven_test_modules }}
  maven-test-roots:
    description: Comma-separated reactor roots for verify -f (may be empty)
    value: ${{ steps.load.outputs.maven_test_roots }}
  maven-test-root-options:
    description: Per-root Maven verify overrides as JSON (threads, unitTestsParallel)
    value: ${{ steps.load.outputs.maven_test_root_options }}

runs:
  using: composite
  steps:
    - name: Load shard config (${{ inputs.shard-id }})
      id: load
      shell: bash
      env:
        SHARD_ID: ${{ inputs.shard-id }}
      run: |
        set -euo pipefail
        CONFIG="${GITHUB_WORKSPACE}/.github/ci/maven-shards.json"
        if ! jq -e --arg shard "${SHARD_ID}" '.[$shard]' "${CONFIG}" >/dev/null; then
          echo "::error::Unknown shard id: ${SHARD_ID}"
          exit 1
        fi
        write_output() {
          local json_field="$1"
          local output_name="$2"
          local value
          value="$(jq -r --arg shard "${SHARD_ID}" --arg field "${json_field}" '.[$shard][$field] // ""' "${CONFIG}")"
          echo "${output_name}=${value}" >> "${GITHUB_OUTPUT}"
        }
        write_output mavenModules maven_modules
        write_output dockerImages docker_images
        write_output mavenTestModules maven_test_modules
        write_output mavenTestRoots maven_test_roots
        options="$(jq -c --arg shard "${SHARD_ID}" '.[$shard].mavenTestRootOptions // {}' "${CONFIG}")"
        echo "maven_test_root_options=${options}" >> "${GITHUB_OUTPUT}"
