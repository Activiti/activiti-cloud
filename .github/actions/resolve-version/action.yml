name: Resolve build version
description: Writes VERSION file and exposes the prerelease version as a job output.
inputs:
  version-override:
    description: Optional explicit version (e.g. PR snapshot). When empty, uses update-pom action.
    required: false
    default: ''

outputs:
  version:
    description: Resolved prerelease version used for Docker tags and Helm.
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve override VERSION for pull requests
      id: pr-version
      if: inputs.version-override == '' && github.event_name == 'pull_request'
      shell: bash
      run: |
        echo "version=0.0.1-PR-${{ github.event.pull_request.number }}-SNAPSHOT" >> "$GITHUB_OUTPUT"

    - uses: Alfresco/alfresco-build-tools/.github/actions/update-pom-to-next-pre-release@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
      id: update-pom-to-next-version
      if: inputs.version-override == ''
      with:
        version: ${{ steps.pr-version.outputs.version }}

    - name: Write VERSION file
      id: resolve
      shell: bash
      env:
        INPUT_VERSION_OVERRIDE: ${{ inputs.version-override }}
        NEXT_PRERELEASE: ${{ steps.update-pom-to-next-version.outputs.next-prerelease }}
      run: |
        if [[ -n "${INPUT_VERSION_OVERRIDE}" ]]; then
          VERSION="${INPUT_VERSION_OVERRIDE}"
        else
          VERSION="${NEXT_PRERELEASE}"
        fi
        echo "$VERSION" > VERSION
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
