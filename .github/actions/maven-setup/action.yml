name: Maven setup
description: >-
  Java 25, Maven cache restore, and testcontainers defaults.
  Thin wrapper around cache + setup-java (not alfresco-build-tools maven-configure, which couples
  skip-tests/preview labels and different JDK defaults). Run actions/checkout in the job first.

runs:
  using: composite
  steps:
    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Setup Java JDK 25
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # 5.2.0
      with:
        java-version: 25
        distribution: corretto

    - name: Enable testcontainers reuse option
      shell: bash
      run: |
        echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties
        echo "TESTCONTAINERS_RYUK_DISABLED=true" >> $GITHUB_ENV
