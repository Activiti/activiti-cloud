name: Maven deploy
description: >-
  Deploys Maven artifacts to Cloudsmith for the checked-out project.
  The job must have the `id-token: write` permission.

inputs:
  version:
    description: Version being deployed.
    required: true
  maven-version:
    description: Maven version to set up.
    required: true
  cloudsmith-namespace:
    description: Cloudsmith organization namespace.
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate with Cloudsmith
      uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@16298278308f674c76542d61658da190e975e31c # v19.16.0
      with:
        oidc-namespace: ${{ inputs.cloudsmith-namespace }}
        verify-auth: "true"

    - name: Deploy to Cloudsmith
      uses: Alfresco/alfresco-build-tools/.github/actions/maven-build@16298278308f674c76542d61658da190e975e31c # v19.16.0
      env:
        CLOUDSMITH_NAMESPACE: ${{ inputs.cloudsmith-namespace }}
      with:
        java-version: '25'
        java-distribution: 'corretto'
        maven-version: ${{ inputs.maven-version }}
        maven-command: >-
          deploy -DskipTests -DskipITs -Dskip.common.tests=true -P 'cloudsmith,!attach-sources'
          -Daether.connector.basic.upstreamThreads.cloudsmith=10
          -Dhttp.keepAlive=false
          -Dmaven.wagon.http.pool=false
          -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

    - name: Publish deployed version to job summary
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        echo "## Built version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
