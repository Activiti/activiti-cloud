name: Upload Maven M2 artifacts
description: Upload org.activiti.cloud artifacts from the local Maven repository for cross-job reuse.
inputs:
  artifact-name:
    description: Artifact name (e.g. m2-common, m2-runtime-bundle)
    required: true
  version:
    description: Project version directory under ~/.m2 (e.g. 0.0.1-PR-2314-SNAPSHOT). Used to stage upload only.
    required: true
  retention-days:
    description: Artifact retention in days
    required: false
    default: '1'
  newer-than-file:
    description: >-
      When set, upload only artifactIds whose version directory contains files newer than this marker
      (avoids re-uploading the full M2 tree and corrupting overlapping jars on merge-multiple download).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Stage M2 artifacts (${{ inputs.artifact-name }})
      shell: bash
      env:
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        INPUT_VERSION: ${{ inputs.version }}
        NEWER_THAN: ${{ inputs.newer-than-file }}
      run: |
        STAGE="${RUNNER_TEMP}/m2-stage-${INPUT_ARTIFACT_NAME}"
        rm -rf "${STAGE}"
        mkdir -p "${STAGE}"
        shopt -s nullglob

        stage_module() {
          local module_dir="$1"
          local artifact_id
          artifact_id="$(basename "$(dirname "${module_dir}")")"
          mkdir -p "${STAGE}/${artifact_id}/${INPUT_VERSION}"
          cp -a "${module_dir}/." "${STAGE}/${artifact_id}/${INPUT_VERSION}/"
        }

        if [[ -n "${NEWER_THAN}" && -f "${NEWER_THAN}" ]]; then
          for artifact_id_dir in "${HOME}/.m2/repository/org/activiti/cloud"/*/; do
            [[ -d "${artifact_id_dir}" ]] || continue
            module_dir="${artifact_id_dir}${INPUT_VERSION}"
            [[ -d "${module_dir}" ]] || continue
            if find "${module_dir}" -type f -newer "${NEWER_THAN}" -print -quit | grep -q .; then
              stage_module "${module_dir}"
            fi
          done
        else
          for module_dir in "${HOME}/.m2/repository/org/activiti/cloud"/*/"${INPUT_VERSION}"; do
            stage_module "${module_dir}"
          done
        fi

        if [[ -z "$(ls -A "${STAGE}" 2>/dev/null)" ]]; then
          echo "::error::No org/activiti/cloud artifacts found for version ${INPUT_VERSION}"
          exit 1
        fi

    - name: Upload M2 (${{ inputs.artifact-name }})
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/m2-stage-${{ inputs.artifact-name }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
