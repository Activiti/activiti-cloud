name: Run Playwright acceptance tests
description: Executes Playwright acceptance test.
inputs:
  working-directory:
    required: false
    description: The directory from which to run tests
    default: "."
  script-command:
    description: The npm command to execute playwright tests
    required: true
  diagnostics-artifact-name:
    description: Artifact name for test-results/reporter upload on failure
    required: false
    default: playwright-diagnostics
  rp-token:
    description: The token for Report Portal
    required: true
  rp-url:
    description: The URL for Report Portal API (secret, full endpoint including /api/v1)
    required: true
  rp-project:
    description: The project used in Report Portal
    required: true
  rp-launch-key:
    description: The launch key of the Report Portal job
    required: true
  rp-trigger:
    description: The trigger information for Report Portal
    required: false
    default: CI
  rp-environment:
    description: The environment information for Report Portal
    required: false
    default: activiti

outputs:
  outcome:
    description: Tests outcome ('success', 'failure',...)
    value: ${{ steps.launch-tests.outcome }}

runs:
  using: composite
  steps:

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'

    - name: Get npm cache directory
      id: npm-cache-dir
      shell: bash
      run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

    - name: Setup cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.npm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - uses: Alfresco/alfresco-build-tools/.github/actions/get-branch-name@4e61fa01622e3f3a1898eb059d9a3af208897515 # v18.9.0

    - name: Compute Report Portal Launch key
      id: compute-rp-launch-key
      shell: bash
      env:
        LAUNCH_KEY: ${{ inputs.rp-launch-key }}
      run: echo "key=playwright-$LAUNCH_KEY" >> $GITHUB_OUTPUT

    - name: Add GitHub Step Summary
      shell: bash
      env:
        SCRIPT_COMMAND: ${{ inputs.script-command }}
        RP_PROJECT: ${{ inputs.rp-project }}
        RP_LAUNCH_KEY: ${{ steps.compute-rp-launch-key.outputs.key }}
      run: |
        echo "#### ⏱ Before Playwright Tests: $(date -u +'%Y-%m-%d %H:%M:%S%:z')" >> $GITHUB_STEP_SUMMARY
        echo "#### ⚙ Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- Script command: ${SCRIPT_COMMAND}" >> $GITHUB_STEP_SUMMARY
        echo "- Report Portal project: ${RP_PROJECT}" >> $GITHUB_STEP_SUMMARY
        echo "- Report Portal launch key: ${RP_LAUNCH_KEY}" >> $GITHUB_STEP_SUMMARY

    - name: Run Tests (continue on error)
      id: launch-tests
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      env:
        SCRIPT_COMMAND: ${{ inputs.script-command }}
        REPORT_PORTAL_TOKEN: ${{ inputs.rp-token }}
        REPORT_PORTAL_URL: ${{ inputs.rp-url }}
        REPORT_PORTAL_PROJECT: ${{ inputs.rp-project }}
        REPORT_PORTAL_TRIGGER: ${{ inputs.rp-trigger || 'CI' }}
        REPORT_PORTAL_ENVIRONMENT: ${{ inputs.rp-environment }}
        REPORT_PORTAL_LAUNCH_KEY: ${{ steps.compute-rp-launch-key.outputs.key }}
      run: |
        npm ci --ignore-scripts
        ./node_modules/.bin/playwright install chromium
        set -o pipefail
        eval "${SCRIPT_COMMAND}" 2>&1 | sed -E 's/ReportPortal Launch Link: [^[:space:]]+/ReportPortal Launch Link: [redacted]/g'
        exit "${PIPESTATUS[0]}"
      continue-on-error: true

    - name: Upload Playwright diagnostics on failure
      if: always() && steps.launch-tests.outcome == 'failure'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.diagnostics-artifact-name }}
        path: |
          activiti-cloud-acceptance-tests-playwright/test-results
          activiti-cloud-acceptance-tests-playwright/reporter
          activiti-cloud-acceptance-tests-playwright/playswag-coverage
        retention-days: 7
        if-no-files-found: ignore

    - name: Update GitHub Step Summary
      shell: bash
      run: |
        echo "#### ⏱ After Playwright Tests: $(date -u +'%Y-%m-%d %H:%M:%S%:z')" >> $GITHUB_STEP_SUMMARY

    - name: Exit on failure
      if: steps.launch-tests.outcome != 'success'
      shell: bash
      run: |
        echo "::error title=run-playwright-tests::Tests failed: re-throwing on error."
        exit 1
