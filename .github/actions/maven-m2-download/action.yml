name: Download Maven M2 artifacts
description: Restore org.activiti.cloud artifacts from maven-m2-upload or maven-build M2 uploads.
inputs:
  pattern:
    description: Artifact name pattern passed to download-artifact
    required: false
    default: m2-*
  prefer-dependencies-bom:
    description: >-
      When true with pattern m2-*, download shard artifacts first then m2-dependencies-bom last
      so consolidated BOM wins on overlapping JAR paths.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Download M2 artifacts (${{ inputs.pattern }})
      if: inputs.pattern != 'm2-*' || inputs.prefer-dependencies-bom != 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: ${{ inputs.pattern }}
        merge-multiple: true
        path: ${{ runner.temp }}/m2-download

    - name: Download shard M2 artifacts (m2-*)
      if: inputs.pattern == 'm2-*' && inputs.prefer-dependencies-bom == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: m2-*
        merge-multiple: true
        path: ${{ runner.temp }}/m2-download-shards

    - name: Download consolidated BOM M2 (preferred on conflicts)
      if: inputs.pattern == 'm2-*' && inputs.prefer-dependencies-bom == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      continue-on-error: true
      with:
        name: m2-dependencies-bom
        path: ${{ runner.temp }}/m2-download-bom

    - name: Merge into local Maven repository
      shell: bash
      env:
        INPUT_PATTERN: ${{ inputs.pattern }}
        INPUT_PREFER_DEPENDENCIES_BOM: ${{ inputs.prefer-dependencies-bom }}
      run: |
        shopt -s nullglob
        merge_tree() {
          local src_root="$1"
          [[ -d "${src_root}" ]] || return 0
          if [[ -d "${src_root}/org/activiti/cloud" ]]; then
            mkdir -p "${HOME}/.m2/repository/org/activiti/cloud"
            cp -a "${src_root}/org/activiti/cloud/." \
              "${HOME}/.m2/repository/org/activiti/cloud/"
            return 0
          fi
          for artifact_id in "${src_root}"/*; do
            [[ -d "${artifact_id}" ]] || continue
            mkdir -p "${HOME}/.m2/repository/org/activiti/cloud/$(basename "${artifact_id}")"
            cp -a "${artifact_id}/." \
              "${HOME}/.m2/repository/org/activiti/cloud/$(basename "${artifact_id}")/"
          done
        }

        if [[ "${INPUT_PATTERN}" == "m2-*" && "${INPUT_PREFER_DEPENDENCIES_BOM}" == "true" ]]; then
          merge_tree "${{ runner.temp }}/m2-download-shards"
          merge_tree "${{ runner.temp }}/m2-download-bom"
        else
          merge_tree "${{ runner.temp }}/m2-download"
        fi
