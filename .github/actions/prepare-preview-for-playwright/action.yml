name: Prepare preview for Playwright (CI)
description: >-
  Waits for Helm workloads, loads Keycloak secret, and applies acceptance overlay
  (policies + example-runtime-bundle). Playwright global-setup skips this in CI.

runs:
  using: composite
  steps:
    - name: Prepare cluster for acceptance tests
      shell: bash
      run: |
        set -euo pipefail

        if [[ -z "${PREVIEW_NAME:-}" ]]; then
          echo "PREVIEW_NAME is not set"
          exit 1
        fi

        export CI=true
        export GITHUB_ACTIONS=true
        export GATEWAY_PROTOCOL="${GATEWAY_PROTOCOL:-https}"
        export CLUSTER_DOMAIN="${CLUSTER_DOMAIN:-envalfresco.com}"

        if [[ -z "${GATEWAY_HOST:-}" && -n "${CLUSTER_NAME:-}" ]]; then
          export GATEWAY_HOST="gateway-${PREVIEW_NAME}.${CLUSTER_NAME}.${CLUSTER_DOMAIN}"
        fi
        if [[ -z "${SSO_HOST:-}" && -n "${CLUSTER_NAME:-}" ]]; then
          export SSO_HOST="identity-${PREVIEW_NAME}.${CLUSTER_NAME}.${CLUSTER_DOMAIN}"
        fi

        # shellcheck source=scripts/lib/keycloak-preview.sh
        source "${GITHUB_WORKSPACE}/scripts/lib/keycloak-preview.sh"

        echo "Waiting for Activiti deployments in ${PREVIEW_NAME}..."
        # shellcheck source=activiti-cloud-acceptance-tests-playwright/scripts/lib/cluster-discovery.sh
        source "${GITHUB_WORKSPACE}/activiti-cloud-acceptance-tests-playwright/scripts/lib/cluster-discovery.sh"
        wait_for_acceptance_deployments "${PREVIEW_NAME}"

        echo "Applying acceptance overlay (runtime-bundle image + security policies)..."
        bash "${GITHUB_WORKSPACE}/activiti-cloud-acceptance-tests-playwright/scripts/apply-cluster-prereqs.sh" "${PREVIEW_NAME}"

        # Secret is created per Helm install (global.keycloak.clientSecret / activiti-keycloak-client).
        # Always re-read after overlay rollouts — do not reuse a stale GITHUB_ENV value.
        echo "Loading activiti client secret from ${PREVIEW_NAME}/activiti-keycloak-client..."
        KEYCLOAK_CLIENT_SECRET="$(wait_for_preview_keycloak_client_secret "${PREVIEW_NAME}")"
        echo "::add-mask::${KEYCLOAK_CLIENT_SECRET}"
        echo "KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}" >> "${GITHUB_ENV}"

        TOKEN_URL="$(preview_sso_token_url "${PREVIEW_NAME}" activiti)"
        TOKEN_HTTP="$(curl -sS -o /tmp/acceptance-token-check.json -w '%{http_code}' \
          -X POST "${TOKEN_URL}" \
          -d "grant_type=password" \
          -d "client_id=activiti" \
          -d "client_secret=${KEYCLOAK_CLIENT_SECRET}" \
          -d "username=testuser" \
          -d "password=password" || echo "000")"
        if [[ "${TOKEN_HTTP}" != "200" ]]; then
          echo "::error::Keycloak token check failed (HTTP ${TOKEN_HTTP}) at ${TOKEN_URL}"
          cat /tmp/acceptance-token-check.json 2>/dev/null || true
          exit 1
        fi
        echo "✓ Keycloak token OK for testuser (client activiti, secret from namespace)"

        ACCESS_TOKEN="$(python3 -c "import json; print(json.load(open('/tmp/acceptance-token-check.json'))['access_token'])" 2>/dev/null || true)"
        if [[ -n "${ACCESS_TOKEN}" && -n "${GATEWAY_HOST:-}" ]]; then
          IDENTITY_SEARCH_HTTP="$(curl -sS -o /tmp/acceptance-identity-groups.json -w '%{http_code}' \
            --max-time 30 \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://${GATEWAY_HOST}/identity-adapter-service/v1/groups?search=sa" || echo "000")"
          if [[ "${IDENTITY_SEARCH_HTTP}" != "200" ]]; then
            echo "::error::identity-adapter group search check failed (HTTP ${IDENTITY_SEARCH_HTTP})"
            cat /tmp/acceptance-identity-groups.json 2>/dev/null || true
            exit 1
          fi
          echo "✓ identity-adapter group search OK (testuser bearer)"
        fi

        echo "ACCEPTANCE_CI_OVERLAY_APPLIED=true" >> "${GITHUB_ENV}"
        echo "✓ Preview ${PREVIEW_NAME} ready for Playwright"
