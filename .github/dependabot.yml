version: 2
updates:
  - package-ecosystem: "maven"
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "org.activiti:*"
      # Security update for Netty 4.1.x, remove with Spring Boot upgrade
      - dependency-name: "io.netty:*"
        versions:
          - ">= 4.2"
      # Security update for plexus-utils 3.x
      - dependency-name: "org.codehaus.plexus:plexus-utils"
        versions:
          - ">= 4.0"

  - package-ecosystem: "github-actions"
    directories:
    - "/"
    - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
