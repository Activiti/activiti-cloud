version: 2
updates:
  - package-ecosystem: "maven"
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "org.activiti:*"
      - dependency-name: "org.assertj:assertj-core"
        versions:
          - ">= 4"
      # Security update for Netty 4.1.x, remove with Spring Boot upgrade
      - dependency-name: "io.netty:*"
        versions:
          - ">= 4.2"
      # Security updates to Spring Boot on 3.5.x, remove with 4.x update
      - dependency-name: "org.springframework.boot:*"
        versions:
          - ">= 4.0"

  - package-ecosystem: "github-actions"
    directories:
    - "/"
    - "/.github/actions/check-service-health"
    - "/.github/actions/load-acceptance-test-env"
    - "/.github/actions/load-playwright-profile-config"
    - "/.github/actions/load-preview-keycloak-secret"
    - "/.github/actions/maven-deploy"
    - "/.github/actions/playwright-run"
    - "/.github/actions/prepare-preview-for-playwright"
    - "/.github/actions/setup-env-for-broker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Managed by gh aw add. Version-locked to the gh-aw compiler; do not bump.
      - dependency-name: "github/gh-aw-actions"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/.github/actions/force-full-model-cleanup"
      - "/.github/actions/project-models-cleanup"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      framework:
        patterns:
          - "@playwright/test"
          - "@reportportal/agent-js-playwright"
        update-types:
          - "minor"
          - "patch"
      tools:
        patterns:
          - "dotenv*"
          - "winston"
        update-types:
          - "minor"
          - "patch"
