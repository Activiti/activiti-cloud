name: "Dependency Graph Submission of Transitive Dependencies"

on:
  push:
    branches: ["develop"]

env:
  MAVEN_VERSION: "3.10.0"

jobs:
  submit:
    name: Submit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: "25"
          distribution: "corretto"
      - name: Submit Dependency Graph
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-dependency-scan@2cebc8f19812b2653361d82e86b25f29cfa4a144 # v19.12.1
        with:
          java-version: '25'
          maven-version: ${{ env.MAVEN_VERSION }}
          maven-args: -Dmaven.wagon.http.pool=false
          maven-username: ${{ secrets.NEXUS_USERNAME }}
          maven-password: ${{ secrets.NEXUS_PASSWORD }}
