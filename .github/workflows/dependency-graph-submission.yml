name: "Dependency Graph Submission of Transitive Dependencies"

on:
  push:
    branches: ["develop"]

env:
  MAVEN_VERSION: "3.10.0"

jobs:
  submit:
    name: Submit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: "corretto"
      - name: Submit Dependency Graph
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-dependency-scan@v19.7.1
        with:
          java-version: '25'
          maven-version: ${{ env.MAVEN_VERSION }}
          maven-args: -Dmaven.wagon.http.pool=false
          maven-username: ${{ secrets.NEXUS_USERNAME }}
          maven-password: ${{ secrets.NEXUS_PASSWORD }}
