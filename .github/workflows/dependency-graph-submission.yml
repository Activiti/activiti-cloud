name: "Dependency Graph Submission of Transitive Dependencies"

on:
  push:
    branches: ["develop"]
jobs:
  submit:
    name: Submit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "25"
          distribution: "corretto"
      - name: Submit Dependency Graph
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-dependency-scan@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          java-version: '25'
          maven-version: '3.9.9'
          maven-args: -Dmaven.wagon.http.pool=false
          maven-username: ${{ secrets.NEXUS_USERNAME }}
          maven-password: ${{ secrets.NEXUS_PASSWORD }}
