name: "Dependency Graph Submission of Transitive Dependencies"

on:
  push:
    branches: ["develop"]

env:
  MAVEN_VERSION: "3.10.0"
  CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}

jobs:
  submit:
    name: Submit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate with Cloudsmith
        uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          oidc-namespace: ${{ env.CLOUDSMITH_NAMESPACE }}
          verify-auth: "true"
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: "corretto"
      - name: Submit Dependency Graph
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-dependency-scan@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          java-version: '25'
          maven-version: ${{ env.MAVEN_VERSION }}
          maven-args: -Dmaven.wagon.http.pool=false
          maven-username: ${{ secrets.NEXUS_USERNAME }}
          maven-password: ${{ secrets.NEXUS_PASSWORD }}
