name: Playwright acceptance

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      ACCEPTANCE_TESTUSER_PASSWORD:
        required: true
      ACCEPTANCE_HRUSER_PASSWORD:
        required: true
      ACCEPTANCE_HRADMIN_PASSWORD:
        required: true
      ACCEPTANCE_PROCESSADMINUSER_PASSWORD:
        required: true
      ACCEPTANCE_TESTADMIN_PASSWORD:
        required: true
      RANCHER2_URL:
        required: true
      RANCHER2_ACCESS_KEY:
        required: true
      RANCHER2_SECRET_KEY:
        required: true

env:
  CLUSTER_NAME: activiti
  CLUSTER_DOMAIN: envalfresco.com
  GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
  ACTIVITI_CLOUD_FULL_CHART_RELEASE_BRANCH: develop
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: playwright (${{ matrix.profile }})
    runs-on: ubuntu-latest
    concurrency:
      group: playwright-activiti-slot-${{ matrix.concurrency-slot }}
      cancel-in-progress: false
    strategy:
      max-parallel: 4 # this is a max parallel - above that, the jobs will fail
      fail-fast: false
      matrix:
        include:
          - profile: rabbitmq-partitioned-default
            concurrency-slot: 1
          - profile: rabbitmq-non-partitioned-default
            concurrency-slot: 2
          - profile: kafka-partitioned-default
            concurrency-slot: 3
          - profile: kafka-non-partitioned-default
            concurrency-slot: 4
          - profile: kafka-partitioned-override
            concurrency-slot: 1
          - profile: rabbitmq-non-partitioned-pdb
            concurrency-slot: 2
          - profile: rabbitmq-prefix-pdb
            concurrency-slot: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/load-acceptance-test-env
        with:
          testuser-username: ${{ vars.ACCEPTANCE_TESTUSER_USERNAME || 'testuser' }}
          testuser-password: ${{ secrets.ACCEPTANCE_TESTUSER_PASSWORD }}
          hruser-username: ${{ vars.ACCEPTANCE_HRUSER_USERNAME || 'hruser' }}
          hruser-password: ${{ secrets.ACCEPTANCE_HRUSER_PASSWORD }}
          hradmin-username: ${{ vars.ACCEPTANCE_HRADMIN_USERNAME || 'hradmin' }}
          hradmin-password: ${{ secrets.ACCEPTANCE_HRADMIN_PASSWORD }}
          processadminuser-username: ${{ vars.ACCEPTANCE_PROCESSADMINUSER_USERNAME || 'processadminuser' }}
          processadminuser-password: ${{ secrets.ACCEPTANCE_PROCESSADMINUSER_PASSWORD }}
          testadmin-username: ${{ vars.ACCEPTANCE_TESTADMIN_USERNAME || 'testadmin' }}
          testadmin-password: ${{ secrets.ACCEPTANCE_TESTADMIN_PASSWORD }}

      - id: pw-profile
        uses: ./.github/actions/load-playwright-profile-config
        with:
          profile: ${{ matrix.profile }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.19.6

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.5.2

      - name: Set up rancher
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-rancher-cli@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          url: ${{ secrets.RANCHER2_URL }}
          access-key: ${{ secrets.RANCHER2_ACCESS_KEY }}
          secret-key: ${{ secrets.RANCHER2_SECRET_KEY }}
          context: ${{ env.CLUSTER_NAME }}

      - uses: ./.github/actions/setup-env-for-broker
        with:
          messaging-broker: ${{ steps.pw-profile.outputs.messaging-broker }}
          messaging-partitioning-option: ${{ steps.pw-profile.outputs.messaging-partitioned }}
          messaging-destinations-option: ${{ steps.pw-profile.outputs.messaging-destinations }}
          version: ${{ inputs.version }}

      - name: Cache Helm chart checkout
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .git/activiti-cloud-full-chart
          key: activiti-full-chart-${{ env.ACTIVITI_CLOUD_FULL_CHART_RELEASE_BRANCH }}-${{ inputs.version }}

      - name: Delete preview for ${{ matrix.profile }}
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview') }}
        run: kubectl delete ns "$PREVIEW_NAME" || true

      - name: Install release (${{ matrix.profile }})
        run: bash scripts/ci/install-preview-release.sh

      - name: (kafka,partitioned) Checks that consumers can be a different number from partitions
        if: >-
          steps.pw-profile.outputs.messaging-broker == 'kafka'
          && steps.pw-profile.outputs.messaging-partitioned == 'partitioned'
          && steps.pw-profile.outputs.messaging-destinations == 'default-destinations'
        run: bash scripts/ci/kafka-partitioned-consumer-check.sh

      - uses: ./.github/actions/check-service-health
        with:
          health-url: ${{ env.GATEWAY_PROTOCOL }}://${{ env.GATEWAY_HOST }}/identity-adapter-service/actuator/health

      - uses: ./.github/actions/prepare-preview-for-playwright

      - uses: ./.github/actions/check-service-health
        with:
          health-url: ${{ env.GATEWAY_PROTOCOL }}://${{ env.GATEWAY_HOST }}/rb/actuator/health

      - uses: ./.github/actions/check-service-health
        with:
          health-url: ${{ env.GATEWAY_PROTOCOL }}://${{ env.GATEWAY_HOST }}/query/actuator/health

      - name: Export Playwright CI environment
        run: bash scripts/ci/export-playwright-ci-env.sh

      - uses: ./.github/actions/playwright-run
        with:
          script-command: "npm run test:all"
          diagnostics-artifact-name: playwright-diagnostics-${{ matrix.profile }}

      - name: Delete Helm release (${{ matrix.profile }})
        if: always()
        run: make delete
