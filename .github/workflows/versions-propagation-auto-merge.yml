name: Versions propagation auto-merge
on:
  pull_request:
    types: [labeled]
    branches:
      - 9.0.x
jobs:
  versions-propagation-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/automate-propagation@40f2376b812403b51e0cea49eaff04c1b8d65cfd # v15.7.1
        with:
          auto-merge-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          approval-token: ${{ secrets.GITHUB_TOKEN }}
