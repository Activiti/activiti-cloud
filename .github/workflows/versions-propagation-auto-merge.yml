name: Versions propagation auto-merge
on:
  pull_request:
    types: [labeled]
    branches:
      - develop

jobs:
  versions-propagation-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/automate-propagation@f2ba011b2bd8bee8d7418b046541ce2f75d1fbed # v19.4.0
        with:
          auto-merge-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          approval-token: ${{ secrets.GITHUB_TOKEN }}
          pr-author-login: ${{ vars.HXPS_GIT_USERNAME }}
