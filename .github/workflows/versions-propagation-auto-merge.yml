name: Versions propagation auto-merge
on:
  pull_request:
    types: [labeled]
    branches:
      - 8.8.x
jobs:
  versions-propagation-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/automate-propagation@e5221d8092e0529c67dceb9a61d552f1d81e291a # v14.1.1
        with:
          auto-merge-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          approval-token: ${{ secrets.GITHUB_TOKEN }}
