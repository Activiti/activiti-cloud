name: Versions propagation auto-merge
on:
  pull_request:
    types: [labeled]
    branches:
      - develop

jobs:
  versions-propagation-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/automate-propagation@ac0009fd55b474dbf50864caa4f9da36a41e5ffe # v18.21.2
        with:
          auto-merge-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          approval-token: ${{ secrets.GITHUB_TOKEN }}
          pr-author-login: ${{ vars.HXPS_GIT_USERNAME }}
