name: Maven test (library modules)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      BOT_GITHUB_TOKEN:
        required: true
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true

jobs:
  test:
    name: maven-test-library (${{ matrix.library-id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        library-id: [messages-graphql, audit]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - id: library
        name: Load library module config (${{ matrix.library-id }})
        shell: bash
        env:
          LIBRARY_ID: ${{ matrix.library-id }}
        run: |
          set -euo pipefail
          CONFIG="${GITHUB_WORKSPACE}/.github/ci/library-modules.json"
          modules="$(jq -r --arg id "${LIBRARY_ID}" '.[$id].mavenModules' "${CONFIG}")"
          echo "maven-modules=${modules}" >> "${GITHUB_OUTPUT}"

      - name: Write VERSION file
        shell: bash
        env:
          PROJECT_VERSION: ${{ inputs.version }}
        run: |
          echo "${PROJECT_VERSION}" > VERSION
          echo "VERSION=${PROJECT_VERSION}" >> "$GITHUB_ENV"

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-update-pom-version@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          version: ${{ inputs.version }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-build@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        with:
          java-version: '25'
          java-distribution: 'corretto'
          reuse-testcontainers: 'true'
          maven-command: >-
            verify -Dskip.common.tests=true -pl ${{ steps.library.outputs.maven-modules }} -am
            -T 1C -DunitTests.parallel=true -U
          jacoco-report-name: jacoco-${{ matrix.library-id }}
          target-folder-upload-name: target-${{ matrix.library-id }}
          m2-current-build-upload-name: m2-test-${{ matrix.library-id }}
          m2-cache-exclusion-pattern: org/activiti
          uploaded-artifacts-retention-days: '1'
