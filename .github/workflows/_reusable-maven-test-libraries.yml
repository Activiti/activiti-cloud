name: Maven test (library modules)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      BOT_GITHUB_TOKEN:
        required: true
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true

env:
  MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml

jobs:
  test:
    name: maven-test-library (${{ matrix.library-id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        library-id: [messages-graphql, audit]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - id: library
        name: Load library module config (${{ matrix.library-id }})
        shell: bash
        env:
          LIBRARY_ID: ${{ matrix.library-id }}
        run: |
          set -euo pipefail
          CONFIG="${GITHUB_WORKSPACE}/.github/ci/library-modules.json"
          modules="$(jq -r --arg id "${LIBRARY_ID}" '.[$id].mavenModules' "${CONFIG}")"
          echo "maven-modules=${modules}" >> "${GITHUB_OUTPUT}"

      - name: Write VERSION file
        shell: bash
        env:
          PROJECT_VERSION: ${{ inputs.version }}
        run: |
          echo "${PROJECT_VERSION}" > VERSION
          echo "VERSION=${PROJECT_VERSION}" >> "$GITHUB_ENV"

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-update-pom-version@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          version: ${{ inputs.version }}
          maven-cli-opts: ${{ env.MAVEN_CLI_OPTS }}

      - name: Maven test (${{ matrix.library-id }})
        shell: bash
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mvn verify -Dskip.common.tests=true -pl "${{ steps.library.outputs.maven-modules }}" -am \
            -T 1C -DunitTests.parallel=true -U ${{ env.MAVEN_CLI_OPTS }}

      - name: Upload JaCoCo data (${{ matrix.library-id }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jacoco-${{ matrix.library-id }}
          path: |
            **/jacoco.exec
            **/jacoco-it.exec
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload test reports (${{ matrix.library-id }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: surefire-reports-${{ matrix.library-id }}
          path: '**/surefire-reports'
          retention-days: 7
          if-no-files-found: ignore
