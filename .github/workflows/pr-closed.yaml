name: Close PR

# only trigger on pull request closed events
on:
  pull_request_target:
    types: [ closed ]

env:
  CLUSTER_NAME: activiti
  CLUSTER_DOMAIN: envalfresco.com
  GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - rabbitmq-partitioned-default
          - rabbitmq-non-partitioned-default
          - kafka-partitioned-default
          - kafka-non-partitioned-default
          - kafka-partitioned-override
          - rabbitmq-non-partitioned-pdb
          - rabbitmq-prefix-pdb
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.19.6

      - name: Set up rancher
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-rancher-cli@499eb5d58f3f82a4efa4eaedab26dbecff18328c # v18.15.1
        with:
          url: ${{ secrets.RANCHER2_URL }}
          access-key: ${{ secrets.RANCHER2_ACCESS_KEY }}
          secret-key: ${{ secrets.RANCHER2_SECRET_KEY }}
          context: ${{ env.CLUSTER_NAME }}

      - id: pw-profile
        uses: ./.github/actions/load-playwright-profile-config
        with:
          profile: ${{ matrix.profile }}

      - name: Delete preview namespace (${{ matrix.profile }})
        shell: bash
        env:
          MESSAGING_BROKER: ${{ steps.pw-profile.outputs.messaging-broker }}
          MESSAGING_PARTITIONED: ${{ steps.pw-profile.outputs.messaging-partitioned }}
          MESSAGING_DESTINATIONS: ${{ steps.pw-profile.outputs.messaging-destinations }}
        run: |
          # shellcheck source=scripts/lib/preview-env.sh
          source "${GITHUB_WORKSPACE}/scripts/lib/preview-env.sh"
          PREVIEW_NAME="$(preview_name_from_ci_matrix \
            "${GITHUB_PR_NUMBER}" \
            "${GITHUB_RUN_NUMBER}" \
            "${MESSAGING_BROKER}" \
            "${MESSAGING_PARTITIONED}" \
            "${MESSAGING_DESTINATIONS}")"
          echo "PR #${{ github.event.pull_request.number }} closed — deleting ${PREVIEW_NAME}"
          kubectl delete ns "${PREVIEW_NAME}" || true

  cleanup-test-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set preview version
        run: echo "0.0.1-PR-${GITHUB_PR_NUMBER}-SNAPSHOT" > VERSION

      - name: Delete Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          echo "Delete Docker images for $(cat VERSION)"
          make docker-delete-all
