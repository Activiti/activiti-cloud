name: Close PR

# only trigger on pull request closed events
on:
  pull_request_target:
    types: [ closed ]

env:
  CLUSTER_NAME: activiti
  CLUSTER_DOMAIN: envalfresco.com
  GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - rabbitmq-partitioned-default
          - rabbitmq-non-partitioned-default
          - kafka-partitioned-default
          - kafka-non-partitioned-default
          - kafka-partitioned-override
          - rabbitmq-non-partitioned-pdb
          - rabbitmq-prefix-pdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.19.6

      - name: Set up rancher
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-rancher-cli@f2ba011b2bd8bee8d7418b046541ce2f75d1fbed # v19.4.0
        with:
          url: ${{ secrets.RANCHER2_URL }}
          access-key: ${{ secrets.RANCHER2_ACCESS_KEY }}
          secret-key: ${{ secrets.RANCHER2_SECRET_KEY }}
          context: ${{ env.CLUSTER_NAME }}

      - id: pw-profile
        uses: ./.github/actions/load-playwright-profile-config
        with:
          profile: ${{ matrix.profile }}

      - name: Delete preview namespace (${{ matrix.profile }})
        shell: bash
        env:
          MESSAGING_BROKER: ${{ steps.pw-profile.outputs.messaging-broker }}
          MESSAGING_PARTITIONED: ${{ steps.pw-profile.outputs.messaging-partitioned }}
          MESSAGING_DESTINATIONS: ${{ steps.pw-profile.outputs.messaging-destinations }}
        run: |
          # shellcheck source=scripts/lib/preview-env.sh
          source "${GITHUB_WORKSPACE}/scripts/lib/preview-env.sh"
          PREVIEW_NAME="$(preview_name_from_ci_matrix \
            "${GITHUB_PR_NUMBER}" \
            "${GITHUB_RUN_NUMBER}" \
            "${MESSAGING_BROKER}" \
            "${MESSAGING_PARTITIONED}" \
            "${MESSAGING_DESTINATIONS}")"
          echo "PR #${{ github.event.pull_request.number }} closed — deleting ${PREVIEW_NAME}"
          kubectl delete ns "${PREVIEW_NAME}" || true

  cleanup-test-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set preview version
        run: echo "0.0.1-PR-${GITHUB_PR_NUMBER}-SNAPSHOT" > VERSION

      - name: Delete Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          echo "Delete Docker images for $(cat VERSION)"
          make docker-delete-all

  cleanup-preview-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Close downstream preview PRs for this source PR only
        uses: Alfresco/alfresco-build-tools/.github/actions/github-close-orphaned-preview-pr@5d33aec6cf9ffd70982c404ebf5ebadedd7405d9 # v19.5.0
        with:
          source-pr-number: ${{ github.event.pull_request.number }}
          source-pr-state: ${{ github.event.pull_request.state }}
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
