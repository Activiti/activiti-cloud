name: Cloudsmith cold build benchmark

on:
  pull_request:
    branches: [improvement/AAE-55154-upload-artifacts-cloudsmith]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/cloudsmith-cold-benchmark.yml
      - scripts/ci/cloudsmith-cold-benchmark.py

permissions:
  contents: read

concurrency:
  group: cloudsmith-cold-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.head_ref == 'codex/aae-55154-cloudsmith-cold-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAVEN_ARGS: ""
      CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: benchmark

      - name: Check out the same source used for the upload benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b93967ebdface9c8dbab7920d94bf4a9b7acb0b1
          path: project

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: corretto

      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-maven@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          version: '3.10.0'

      - name: Compare current repositories with Cloudsmith using empty Maven caches
        run: >-
          python3 benchmark/scripts/ci/cloudsmith-cold-benchmark.py
          --source project
          --output "$RUNNER_TEMP/cloudsmith-cold-benchmark"

      - name: Upload measurements and Maven logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudsmith-cold-build-benchmark
          path: |
            ${{ runner.temp }}/cloudsmith-cold-benchmark/*.json
            ${{ runner.temp }}/cloudsmith-cold-benchmark/*.log
          retention-days: 7
          if-no-files-found: warn
