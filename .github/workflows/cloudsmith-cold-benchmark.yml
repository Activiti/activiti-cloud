name: Cloudsmith cold build benchmark

on:
  pull_request:
    branches: [improvement/AAE-55154-upload-artifacts-cloudsmith]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/cloudsmith-cold-benchmark.yml
      - scripts/ci/cloudsmith-cold-benchmark.py

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudsmith-cold-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.head_ref == 'codex/aae-55154-cloudsmith-cold-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: benchmark

      - name: Download completed benchmark measurements
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudsmith-cold-build-benchmark
          run-id: 41805201512
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cloudsmith-cold-benchmark

      - name: Validate the archived Maven repository origins
        run: >-
          python3 benchmark/scripts/ci/cloudsmith-cold-benchmark.py
          --verify-results "$RUNNER_TEMP/cloudsmith-cold-benchmark/results.json"

      - name: Upload measurements and Maven logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudsmith-cold-build-benchmark
          path: |
            ${{ runner.temp }}/cloudsmith-cold-benchmark/*.json
            ${{ runner.temp }}/cloudsmith-cold-benchmark/*.log
          retention-days: 7
          if-no-files-found: warn
