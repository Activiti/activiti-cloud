name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - milestoned
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true

env:
  CLUSTER_NAME: activiti
  CLUSTER_DOMAIN: envalfresco.com
  GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
  MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml

jobs:
  pre-checks:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.dependabot.outputs.result }}
      skip-tests: ${{ steps.check-skip-tests.outputs.result }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check dependabot build
        uses: Alfresco/alfresco-build-tools/.github/actions/github-require-secrets@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          dependabot-error-message: "This PR requires additional validation, please set the milestone to 'Validating' or ask a reviewer to approve it."
          none-error-message: "Fork PRs cannot be validated in this repository."
      - name: dependabot check
        id: dependabot
        if: ${{ github.event_name == 'push' }}
        uses: Alfresco/alfresco-build-tools/.github/actions/github-pr-check-metadata@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          gh-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          actor: "dependabot[bot]"
          label: github_actions
      - name: Check skip tests
        id: check-skip-tests
        uses: Alfresco/alfresco-build-tools/.github/actions/github-pr-check-metadata@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          gh-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          label: skip-tests
      - name: pre-commit
        uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          skip_checkout: true
      - name: Ensure SHA pinned actions
        uses: hyland/github-actions-ensure-sha-pinned-actions@7d494b6b53e71f75194d74b4dd890a2266d060b5 # v2.0.0

  resolve-version:
    runs-on: ubuntu-latest
    needs: pre-checks
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: ./.github/actions/maven-setup

      - id: version
        uses: ./.github/actions/resolve-version

  maven-build-common:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - resolve-version
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: ./.github/actions/maven-setup

      - name: Write VERSION file
        shell: bash
        run: |
          echo "${{ needs.resolve-version.outputs.version }}" > VERSION
          echo "VERSION=${{ needs.resolve-version.outputs.version }}" >> "$GITHUB_ENV"

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-update-pom-version@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          version: ${{ needs.resolve-version.outputs.version }}
          maven-cli-opts: ${{ env.MAVEN_CLI_OPTS }}

      - name: Maven build common (skip test execution)
        shell: bash
        run: |
          # Do not use -Dmaven.test.skip: reactor modules depend on test-jar artifacts.
          # Do not use -pl <root> either: it installs only the aggregator POM (packaging=pom), not its children.
          MVN_BUILD_FLAGS=(-DskipTests=true -DskipITs=true)
          # Separate -f invocations resolve parents from ~/.m2; install the mono-aggregator POM first.
          echo "::group::install root mono-aggregator POM (-N)"
          mvn -N install "${MVN_BUILD_FLAGS[@]}" ${{ env.MAVEN_CLI_OPTS }}
          echo "::endgroup::"
          ROOTS=(activiti-cloud-build activiti-cloud-api activiti-cloud-service-common)
          for root in "${ROOTS[@]}"; do
            echo "::group::install -f ${root}/pom.xml"
            mvn -f "${root}/pom.xml" install -T 1C \
              "${MVN_BUILD_FLAGS[@]}" ${{ env.MAVEN_CLI_OPTS }}
            echo "::endgroup::"
          done
          # activiti-cloud-dependencies* is built in maven-build-dependencies-bom (imports all service BOMs).
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - uses: ./.github/actions/maven-m2-upload
        with:
          artifact-name: m2-common
          version: ${{ needs.resolve-version.outputs.version }}

      - name: Remove running docker containers
        run: docker rm -f $(docker ps -a -q) || true
        continue-on-error: true

  maven-build:
    needs: [pre-checks, resolve-version, maven-build-common]
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    uses: ./.github/workflows/_reusable-maven-build.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      skip-tests: ${{ needs.pre-checks.outputs.skip-tests }}
    secrets: inherit

  maven-build-dependencies-bom:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - resolve-version
      - maven-build-common
      - maven-build
    if: >-
      needs.pre-checks.outputs.skip != 'true'
      && needs.maven-build-common.result == 'success'
      && needs.maven-build.result == 'success'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: ./.github/actions/maven-setup

      - uses: ./.github/actions/maven-m2-download
        with:
          prefer-dependencies-bom: 'false'

      - name: Write VERSION file
        shell: bash
        run: |
          echo "${{ needs.resolve-version.outputs.version }}" > VERSION
          echo "VERSION=${{ needs.resolve-version.outputs.version }}" >> "$GITHUB_ENV"

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-update-pom-version@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          version: ${{ needs.resolve-version.outputs.version }}
          maven-cli-opts: ${{ env.MAVEN_CLI_OPTS }}

      - name: Install aggregated dependencies BOM
        shell: bash
        run: |
          mvn -f activiti-cloud-dependencies/pom.xml install \
            -DskipTests=true -DskipITs=true \
            ${{ env.MAVEN_CLI_OPTS }}
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - uses: ./.github/actions/maven-m2-upload
        with:
          artifact-name: m2-dependencies-bom
          version: ${{ needs.resolve-version.outputs.version }}

  maven-test:
    needs:
      - pre-checks
      - resolve-version
      - maven-build-common
      - maven-build
      - maven-build-dependencies-bom
    if: >-
      needs.pre-checks.outputs.skip != 'true'
      && needs.pre-checks.outputs.skip-tests != 'true'
      && needs.maven-build-common.result == 'success'
      && needs.maven-build.result == 'success'
      && needs.maven-build-dependencies-bom.result == 'success'
    uses: ./.github/workflows/_reusable-maven-test.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
    secrets: inherit

  maven-jacoco-merge:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - resolve-version
      - maven-build-common
      - maven-build
      - maven-build-dependencies-bom
      - maven-test
    if: >-
      always()
      && needs.pre-checks.outputs.skip != 'true'
      && needs.pre-checks.outputs.skip-tests != 'true'
      && needs.maven-build-common.result == 'success'
      && needs.maven-build.result == 'success'
      && needs.maven-build-dependencies-bom.result == 'success'
      && needs.maven-test.result == 'success'
    env:
      JACOCO_MERGED_FILE: ${{ github.workspace }}/target/jacoco-merged.exec
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/maven-setup

      - uses: ./.github/actions/maven-m2-download

      - name: Write VERSION file
        shell: bash
        run: |
          echo "${{ needs.resolve-version.outputs.version }}" > VERSION
          echo "VERSION=${{ needs.resolve-version.outputs.version }}" >> "$GITHUB_ENV"

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-update-pom-version@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          version: ${{ needs.resolve-version.outputs.version }}
          maven-cli-opts: ${{ env.MAVEN_CLI_OPTS }}

      - name: Download JaCoCo from all test shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: jacoco-*
          merge-multiple: true

      - name: Remove invalid JaCoCo exec files
        shell: bash
        run: |
          set -euo pipefail
          # Some modules can produce empty/truncated jacoco*.exec (e.g. if the JVM exits early).
          # jacoco:merge fails hard on unreadable execs ("Unknown block type 0"), so drop tiny files.
          echo "Scanning for JaCoCo exec files..."
          find . -name 'jacoco*.exec' -type f | wc -l || true

          echo "Deleting suspiciously small exec files (< 128 bytes)..."
          find . -name 'jacoco*.exec' -type f -size -128c -print -delete || true

          echo "Remaining JaCoCo exec files:"
          find . -name 'jacoco*.exec' -type f -print | head -200 || true

      - name: Merge JaCoCo execution files
        shell: bash
        run: mvn -N jacoco:merge -Djacoco.destFile=${{ env.JACOCO_MERGED_FILE }}

      - name: Compile reactor for JaCoCo reports
        shell: bash
        run: mvn compile -DskipTests -DskipITs -T 1C ${{ env.MAVEN_CLI_OPTS }}
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Generate coverage reports
        shell: bash
        run: mvn jacoco:report -Djacoco.dataFile=${{ env.JACOCO_MERGED_FILE }}

      - name: Verify JaCoCo XML reports were generated
        shell: bash
        run: |
          if ! find . -path '*/target/site/jacoco/jacoco.xml' -print -quit | grep -q .; then
            echo '::error::No JaCoCo XML reports found under **/target/site/jacoco/jacoco.xml'
            exit 1
          fi

      - name: Upload JaCoCo merged data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-merged
          path: target/jacoco-merged.exec
          retention-days: 1

      - name: Upload JaCoCo execution data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-exec-all
          path: |
            **/jacoco.exec
            **/jacoco-it.exec
          retention-days: 1
          if-no-files-found: warn

      - name: Upload JaCoCo XML reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-xml-reports
          path: |
            **/target/site/jacoco/jacoco.xml
            **/target/site/jacoco-it/jacoco.xml
          retention-days: 1
          if-no-files-found: error

      - name: Echo longest tests
        shell: bash
        run: find . -name 'TEST-*.xml' -exec grep -h testcase {} \; | awk -F '"' '{printf("%s#%s() - %.3fms\n", $4, $2, $6); }' | sort -n -k 3 | tail -20

  sonar:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - resolve-version
      - maven-jacoco-merge
    if: >-
      needs.pre-checks.outputs.skip != 'true'
      && needs.pre-checks.outputs.skip-tests != 'true'
      && needs.maven-jacoco-merge.result == 'success'
    env:
      JACOCO_MERGED_FILE: ${{ github.workspace }}/target/jacoco-merged.exec
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/maven-setup

      - uses: ./.github/actions/maven-m2-download

      - name: Write VERSION file
        shell: bash
        run: |
          echo "${{ needs.resolve-version.outputs.version }}" > VERSION
          echo "VERSION=${{ needs.resolve-version.outputs.version }}" >> "$GITHUB_ENV"

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-update-pom-version@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          version: ${{ needs.resolve-version.outputs.version }}
          maven-cli-opts: ${{ env.MAVEN_CLI_OPTS }}

      - name: Download JaCoCo merged execution data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jacoco-merged
          path: target

      - name: Compile reactor for Sonar (classes + JaCoCo report inputs)
        shell: bash
        run: mvn compile -DskipTests -DskipITs -T 1C ${{ env.MAVEN_CLI_OPTS }}
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Generate coverage reports
        shell: bash
        run: mvn jacoco:report -Djacoco.dataFile=${{ env.JACOCO_MERGED_FILE }} ${{ env.MAVEN_CLI_OPTS }}
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Run SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        shell: bash
        run: >-
          mvn sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=activiti
          -Dsonar.projectKey=Activiti_activiti-cloud
          -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco*/jacoco.xml
          ${{ env.MAVEN_CLI_OPTS }}
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  playwright-tests:
    needs:
      - pre-checks
      - resolve-version
      - maven-build
    if: >-
      needs.pre-checks.outputs.skip != 'true'
      && needs.pre-checks.outputs.skip-tests != 'true'
      && needs.maven-build.result == 'success'
    uses: ./.github/workflows/_reusable-playwright-tests.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
    secrets: inherit

  build-summary:
    runs-on: ubuntu-latest
    name: build summary
    if: ${{ always() && needs.pre-checks.outputs.skip != 'true' }}
    needs:
      - pre-checks
      - resolve-version
      - maven-build-common
      - maven-build
      - maven-build-dependencies-bom
      - maven-test
      - maven-jacoco-merge
      - sonar
      - playwright-tests
    steps:
      - name: Check CI results
        if: >-
          ${{
              contains(needs.maven-build-common.result, 'failure')
           || contains(needs.maven-build-common.result, 'cancelled')
           || contains(needs.maven-build.result, 'failure')
           || contains(needs.maven-build.result, 'cancelled')
           || contains(needs.maven-build-dependencies-bom.result, 'failure')
           || contains(needs.maven-build-dependencies-bom.result, 'cancelled')
           || contains(needs.maven-test.result, 'failure')
           || contains(needs.maven-test.result, 'cancelled')
           || contains(needs.maven-jacoco-merge.result, 'failure')
           || contains(needs.maven-jacoco-merge.result, 'cancelled')
           || contains(needs.sonar.result, 'failure')
           || contains(needs.sonar.result, 'cancelled')
           || contains(needs.playwright-tests.result, 'failure')
           || contains(needs.playwright-tests.result, 'cancelled')
          }}
        run: |
          echo "CI jobs have failed or been cancelled. Exiting ..."
          exit 1

      - name: Check if tests were skipped
        shell: bash
        run: |
          if [[ "${{ needs.pre-checks.outputs.skip-tests }}" == "true" ]]; then
            echo "::error::This pull request cannot be merged. Remove the 'skip-tests' label to enable tests and merge."
            exit 1
          else
            echo "This pull request can be merged."
          fi

  delete-test-images:
    runs-on: ubuntu-latest
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    needs:
      - pre-checks
      - resolve-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Delete Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          IS_PREVIEW: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview') }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          if [ $IS_PREVIEW = true ] || [ $GITHUB_EVENT_NAME = "push" ]
          then
              echo "Skipping delete Docker images"
          else
              echo $VERSION > VERSION
              echo "Delete Docker images"
              make docker-delete-all
          fi

  publish:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - resolve-version
      - maven-build-common
      - maven-build
      - maven-build-dependencies-bom
      - build-summary
      - delete-test-images
    if: >-
      (github.event_name == 'push' && needs.pre-checks.outputs.skip != 'true'
        || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview')))
      && needs.maven-build-common.result == 'success'
      && needs.maven-build.result == 'success'
      && needs.maven-build-dependencies-bom.result == 'success'
      && (
        needs.build-summary.result == 'success'
        || (github.event_name == 'push' && needs.pre-checks.outputs.skip-tests == 'true')
      )
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: ./.github/actions/maven-setup

      - uses: ./.github/actions/maven-m2-download

      - name: Write VERSION file
        shell: bash
        run: |
          echo "${{ needs.resolve-version.outputs.version }}" > VERSION
          echo "VERSION=${{ needs.resolve-version.outputs.version }}" >> "$GITHUB_ENV"

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-update-pom-version@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          version: ${{ needs.resolve-version.outputs.version }}
          maven-cli-opts: ${{ env.MAVEN_CLI_OPTS }}

      - name: Maven Deploy
        shell: bash
        run: mvn deploy -DskipTests ${{ env.MAVEN_CLI_OPTS}} ${{env.MAVEN_CLI_CONNECTION_OPTS}}
        env:
          MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml
          MAVEN_CLI_CONNECTION_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/git-commit-changes@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          username: ${{ secrets.BOT_GITHUB_USERNAME }}
          add-options: -u
          commit-message: "Release $VERSION"

      - name: Create release tag
        if: github.event_name == 'push'
        run: |
          git tag -fa $VERSION -m "Release version $VERSION"
          git push origin $VERSION

  propagate-maven:
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - publish
    if: github.event_name == 'push'
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      DEVELOPMENT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: Alfresco/alfresco-build-tools/.github/actions/jx-updatebot-pr@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          version: ${{ needs.resolve-version.outputs.version }}
          auto-merge: "true"
          labels: "be-propagation,${{ env.DEVELOPMENT_BRANCH }}"
          base-branch-name: ${{ env.DEVELOPMENT_BRANCH }}
          git-username: ${{ secrets.BOT_GITHUB_USERNAME }}
          git-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          git-author-name: ${{ secrets.BOT_GITHUB_USERNAME }}

  propagate-helm:
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - publish
    if: github.event_name == 'push' && github.ref_name == 'develop'
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      FULL_CHART_DIR: full-chart
      FULL_CHART_BASE_BRANCH: develop
      FULL_CHART_PR_BRANCH: update-docker-images-${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: ${{ env.FULL_CHART_DIR }}
          repository: Activiti/activiti-cloud-full-chart
          ref: ${{ env.FULL_CHART_BASE_BRANCH }}
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
      - name: Update image tags in Helm chart
        working-directory: ${{ env.FULL_CHART_DIR }}/charts/activiti-cloud-full-example
        run: |
          git checkout -b $FULL_CHART_PR_BRANCH
          yq -i e '.runtime-bundle.image.tag = env(VERSION)' values.yaml
          yq -i e '.activiti-cloud-query.image.tag = env(VERSION)' values.yaml
          yq -i e '.activiti-cloud-consumer.image.tag = env(VERSION)' values.yaml
          yq -i e '.activiti-cloud-connector.image.tag = env(VERSION)' values.yaml
          yq -i e '.activiti-cloud-identity-adapter.image.tag = env(VERSION)' values.yaml

      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-helm-docs@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
      - name: Update helm docs
        working-directory: ${{ env.FULL_CHART_DIR}}
        run: helm-docs

      - uses: Alfresco/alfresco-build-tools/.github/actions/git-commit-changes@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          username: ${{ secrets.BOT_GITHUB_USERNAME }}
          add-options: -u
          repository-directory: ${{ env.FULL_CHART_DIR}}
          commit-message: "Update docker image tags to $VERSION"

      - name: Create propagation PR
        working-directory: ${{ env.FULL_CHART_DIR}}
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          git push origin $FULL_CHART_PR_BRANCH
          gh pr create --fill --base $FULL_CHART_BASE_BRANCH --label updatebot --head $(git branch --show-current)

  notify:
    runs-on: ubuntu-latest
    needs:
      - propagate-helm
      - propagate-maven
    if: always() && failure() && github.event_name == 'push'
    steps:
      - name: Teams Notification
        uses: Alfresco/alfresco-build-tools/.github/actions/send-teams-notification@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          webhook-url: ${{ secrets.TEAMS_NOTIFICATION_WORKFLOW_WEBHOOK }}
