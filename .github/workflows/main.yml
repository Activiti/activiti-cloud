name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - milestoned
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true

env:
  CLUSTER_NAME: activiti
  CLUSTER_DOMAIN: envalfresco.com
  GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
  MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml

jobs:
  pre-checks:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.dependabot.outputs.result }}
      skip-tests: ${{ steps.check-skip-tests.outputs.result }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Check PR freshness with develop
        if: github.event_name == 'pull_request'
        shell: bash
        run: bash scripts/ci/check-pr-develop-freshness.sh
      - name: Check dependabot build
        uses: Alfresco/alfresco-build-tools/.github/actions/github-require-secrets@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          dependabot-error-message: "This PR requires additional validation, please set the milestone to 'Validating' or ask a reviewer to approve it."
          none-error-message: "Fork PRs cannot be validated in this repository."
      - name: dependabot check
        id: dependabot
        if: ${{ github.event_name == 'push' }}
        uses: Alfresco/alfresco-build-tools/.github/actions/github-pr-check-metadata@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          gh-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          actor: "dependabot[bot]"
          label: github_actions
      - name: Check skip tests
        id: check-skip-tests
        uses: Alfresco/alfresco-build-tools/.github/actions/github-pr-check-metadata@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          gh-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          label: skip-tests
      - name: pre-commit
        uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          skip_checkout: true
      - name: Ensure SHA pinned actions
        uses: hyland/github-actions-ensure-sha-pinned-actions@7d494b6b53e71f75194d74b4dd890a2266d060b5 # v2.0.0

  create-tag:
    runs-on: ubuntu-latest
    needs: pre-checks
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.export-version.outputs.version }}
      ref: ${{ steps.export-ref.outputs.ref }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-tag@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        if: github.event_name == 'push'
        id: tag
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        with:
          java-version: '25'
          maven-version: '3.9.9'
          git-username: ${{ secrets.BOT_GITHUB_USERNAME }}
          m2-cache-exclusion-pattern: org/activiti

      - name: Export checkout ref
        id: export-ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=${{ steps.tag.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Export build version
        id: export-version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${{ steps.tag.outputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] \
            && [[ ",${{ join(github.event.pull_request.labels.*.name, ',') }}," == *",preview,"* ]]; then
            echo "version=0.0.1-PR-${{ github.event.pull_request.number }}-SNAPSHOT" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(yq e '.project.version' pom.xml)" >> "$GITHUB_OUTPUT"
          fi

  maven-build-common:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - create-tag
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.create-tag.outputs.ref }}
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      # -pl <aggregator> does NOT include its submodules in a filtered reactor.
      # Enumerate every pom.xml under common parents so leaf modules (and tests) are in the reactor.
      # Also include standalone library modules not pulled in by any docker-image cell (-pl -am).
      # TODO: split these into a dedicated maven-build-libraries job when the graph grows further.
      - name: Resolve common parent modules
        id: common-modules
        run: |
          STANDALONE_MODULES=(
            activiti-cloud-messages-service/integration-tests
            activiti-cloud-messages-service/starters/hazelcast
            activiti-cloud-messages-service/starters/jdbc
            activiti-cloud-messages-service/starters/redis
            activiti-cloud-notifications-graphql-service/gatling
            activiti-cloud-notifications-graphql-service/starter
            activiti-cloud-runtime-bundle-service/activiti-cloud-services-runtime-bundle/activiti-cloud-services-identity-basic
            activiti-cloud-runtime-bundle-service/activiti-cloud-services-runtime-bundle/activiti-cloud-runtime-bundle-rest-client
            activiti-cloud-runtime-bundle-service/activiti-cloud-starter-runtime-bundle-it
          )
          MODULES=$(
            {
              find activiti-cloud-build activiti-cloud-api activiti-cloud-service-common -name 'pom.xml' \
                -not -path '*/target/*' \
                -exec dirname {} \;
              printf '%s\n' "${STANDALONE_MODULES[@]}"
            } | sort -u | tr '\n' ',' | sed 's/,$//'
          )
          echo "modules=$MODULES" >> $GITHUB_OUTPUT

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-build@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        with:
          java-version: '25'
          java-distribution: 'corretto'
          maven-version: '3.9.9'
          reuse-testcontainers: 'true'
          maven-command: >-
            install -T 1C -DunitTests.parallel=true
            -pl ${{ steps.common-modules.outputs.modules }} -am
          jacoco-report-name: jacoco-common
          target-folder-upload-name: target-common
          m2-cache-exclusion-pattern: org/activiti
          uploaded-artifacts-retention-days: '1'

  scan-image-dirs:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    outputs:
      transformed-json: ${{ steps.transform.outputs.transformed-json }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - id: scan
        uses: Alfresco/alfresco-build-tools/.github/actions/docker-scan-image-dirs@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0

      - id: transform
        name: Transform docker image matrix
        shell: bash
        env:
          DIRS_AS_JSON: ${{ steps.scan.outputs.image-dirs-with-metadata }}
        run: bash scripts/ci/transform-docker-image-matrix.sh

  maven-build:
    needs:
      - pre-checks
      - create-tag
      - scan-image-dirs
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    uses: ./.github/workflows/_reusable-maven-build.yml
    with:
      matrix-json: ${{ needs.scan-image-dirs.outputs.transformed-json }}
      ref: ${{ needs.create-tag.outputs.ref }}
    secrets:
      BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

  maven-build-dependencies-bom:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - create-tag
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.create-tag.outputs.ref }}
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-build@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        with:
          java-version: '25'
          java-distribution: 'corretto'
          maven-command: >-
            install -T 1C -pl activiti-cloud-dependencies -am
            -DskipTests=true -DskipITs=true
          m2-current-build-upload-name: m2-dependencies-bom
          m2-cache-exclusion-pattern: org/activiti
          uploaded-artifacts-retention-days: '1'

  maven-test:
    needs:
      - pre-checks
      - create-tag
      - scan-image-dirs
    if: >-
      needs.pre-checks.outputs.skip != 'true'
      && needs.pre-checks.outputs.skip-tests != 'true'
    uses: ./.github/workflows/_reusable-maven-test.yml
    with:
      matrix-json: ${{ needs.scan-image-dirs.outputs.transformed-json }}
      ref: ${{ needs.create-tag.outputs.ref }}
    secrets:
      BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  sonar:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - create-tag
      - maven-build-common
      - maven-build
      - maven-build-dependencies-bom
      - maven-test
    if: >-
      needs.pre-checks.outputs.skip != 'true'
      && needs.pre-checks.outputs.skip-tests != 'true'
      && needs.maven-build-common.result == 'success'
      && needs.maven-build.result == 'success'
      && needs.maven-build-dependencies-bom.result == 'success'
      && needs.maven-test.result == 'success'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.create-tag.outputs.ref }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/sonar-scan-on-built-project@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-project: Activiti_activiti-cloud
          sonar-organization: activiti
          m2-uploaded-group-path: ~/.m2/repository/org/activiti/cloud
          ghcr-username: ${{ secrets.BOT_GITHUB_USERNAME }}
          ghcr-password: ${{ secrets.BOT_GITHUB_TOKEN }}
          java-version: '25'

  playwright-tests:
    needs:
      - pre-checks
      - create-tag
      - maven-build
    if: >-
      github.event_name != 'push'
      && needs.pre-checks.outputs.skip != 'true'
      && needs.pre-checks.outputs.skip-tests != 'true'
      && needs.maven-build.result == 'success'
    uses: ./.github/workflows/_reusable-playwright-tests.yml
    with:
      ref: ${{ needs.create-tag.outputs.ref }}
      version: ${{ needs.create-tag.outputs.version }}
    secrets:
      ACCEPTANCE_TESTUSER_PASSWORD: ${{ secrets.ACCEPTANCE_TESTUSER_PASSWORD }}
      ACCEPTANCE_HRUSER_PASSWORD: ${{ secrets.ACCEPTANCE_HRUSER_PASSWORD }}
      ACCEPTANCE_HRADMIN_PASSWORD: ${{ secrets.ACCEPTANCE_HRADMIN_PASSWORD }}
      ACCEPTANCE_PROCESSADMINUSER_PASSWORD: ${{ secrets.ACCEPTANCE_PROCESSADMINUSER_PASSWORD }}
      ACCEPTANCE_TESTADMIN_PASSWORD: ${{ secrets.ACCEPTANCE_TESTADMIN_PASSWORD }}
      RANCHER2_URL: ${{ secrets.RANCHER2_URL }}
      RANCHER2_ACCESS_KEY: ${{ secrets.RANCHER2_ACCESS_KEY }}
      RANCHER2_SECRET_KEY: ${{ secrets.RANCHER2_SECRET_KEY }}
      REPORT_PORTAL_TOKEN: ${{ secrets.REPORT_PORTAL_TOKEN }}
      REPORT_PORTAL_URL: ${{ secrets.REPORT_PORTAL_URL }}

  build-summary:
    runs-on: ubuntu-latest
    name: build summary
    if: ${{ always() && needs.pre-checks.outputs.skip != 'true' }}
    needs:
      - pre-checks
      - create-tag
      - maven-build-common
      - maven-build
      - maven-build-dependencies-bom
      - maven-test
      - sonar
      - playwright-tests
    steps:
      - name: Check CI results
        if: >-
          ${{
              contains(needs.maven-build-common.result, 'failure')
           || contains(needs.maven-build-common.result, 'cancelled')
           || contains(needs.maven-build.result, 'failure')
           || contains(needs.maven-build.result, 'cancelled')
           || contains(needs.maven-build-dependencies-bom.result, 'failure')
           || contains(needs.maven-build-dependencies-bom.result, 'cancelled')
           || contains(needs.maven-test.result, 'failure')
           || contains(needs.maven-test.result, 'cancelled')
           || contains(needs.sonar.result, 'failure')
           || contains(needs.sonar.result, 'cancelled')
           || (needs.playwright-tests.result != 'skipped' && contains(needs.playwright-tests.result, 'failure'))
           || (needs.playwright-tests.result != 'skipped' && contains(needs.playwright-tests.result, 'cancelled'))
          }}
        run: |
          echo "CI jobs have failed or been cancelled. Exiting ..."
          exit 1

      - name: Check if tests were skipped
        shell: bash
        run: |
          if [[ "${{ needs.pre-checks.outputs.skip-tests }}" == "true" ]]; then
            echo "::error::This pull request cannot be merged. Remove the 'skip-tests' label to enable tests and merge."
            exit 1
          else
            echo "This pull request can be merged."
          fi

  delete-test-images:
    runs-on: ubuntu-latest
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    needs:
      - pre-checks
      - create-tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Delete Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          IS_PREVIEW: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview') }}
          VERSION: ${{ needs.create-tag.outputs.version }}
        run: |
          if [ $IS_PREVIEW = true ] || [ $GITHUB_EVENT_NAME = "push" ]
          then
              echo "Skipping delete Docker images"
          else
              echo $VERSION > VERSION
              echo "Delete Docker images"
              make docker-delete-all
          fi

  publish:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - create-tag
      - maven-build-common
      - maven-build
      - maven-build-dependencies-bom
      - build-summary
      - delete-test-images
    if: >-
      (github.event_name == 'push' && needs.pre-checks.outputs.skip != 'true'
        || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview')))
      && needs.maven-build-common.result == 'success'
      && needs.maven-build.result == 'success'
      && needs.maven-build-dependencies-bom.result == 'success'
      && (
        needs.build-summary.result == 'success'
        || (github.event_name == 'push' && needs.pre-checks.outputs.skip-tests == 'true')
      )
    env:
      VERSION: ${{ needs.create-tag.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.create-tag.outputs.ref }}
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-build@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        with:
          java-version: '25'
          java-distribution: 'corretto'
          maven-command: >-
            deploy -DskipTests -Dskip.common.tests=true
            -Dhttp.keepAlive=false
            -Dmaven.wagon.http.pool=false
            -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

  propagate-maven:
    runs-on: ubuntu-latest
    needs:
      - create-tag
      - publish
    if: github.event_name == 'push'
    env:
      VERSION: ${{ needs.create-tag.outputs.version }}
      DEVELOPMENT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: Alfresco/alfresco-build-tools/.github/actions/jx-updatebot-pr@10cea6c0b390c4f8af21d9dc1670d581bd10319f # v18.13.0
        with:
          version: ${{ needs.create-tag.outputs.version }}
          auto-merge: "true"
          labels: "be-propagation,${{ env.DEVELOPMENT_BRANCH }}"
          base-branch-name: ${{ env.DEVELOPMENT_BRANCH }}
          git-username: ${{ vars.HXPS_GIT_USERNAME }}
          git-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          git-author-name: ${{ vars.HXPS_GIT_USERNAME }}
          git-author-email: ${{ vars.HXPS_GIT_EMAIL }}
          gpg-private-key: ${{ secrets.HXPS_GIT_COMMIT_SIGNING_PRIVATE_KEY }}
          gpg-private-key-fingerprint: ${{ secrets.HXPS_GIT_COMMIT_SIGNING_FINGERPRINT }}

  propagate-helm:
    runs-on: ubuntu-latest
    needs:
      - create-tag
      - publish
    if: github.event_name == 'push' && github.ref_name == 'develop'
    env:
      VERSION: ${{ needs.create-tag.outputs.version }}
      FULL_CHART_DIR: full-chart
      FULL_CHART_BASE_BRANCH: develop
      FULL_CHART_PR_BRANCH: update-docker-images-${{ needs.create-tag.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: ${{ env.FULL_CHART_DIR }}
          repository: Activiti/activiti-cloud-full-chart
          ref: ${{ env.FULL_CHART_BASE_BRANCH }}
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
      - name: Update image tags in Helm chart
        working-directory: ${{ env.FULL_CHART_DIR }}/charts/activiti-cloud-full-example
        run: |
          git checkout -b $FULL_CHART_PR_BRANCH
          yq -i e '.runtime-bundle.image.tag = env(VERSION)' values.yaml
          yq -i e '.activiti-cloud-query.image.tag = env(VERSION)' values.yaml
          yq -i e '.activiti-cloud-consumer.image.tag = env(VERSION)' values.yaml
          yq -i e '.activiti-cloud-connector.image.tag = env(VERSION)' values.yaml
          yq -i e '.activiti-cloud-identity-adapter.image.tag = env(VERSION)' values.yaml

      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-helm-docs@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
      - name: Update helm docs
        working-directory: ${{ env.FULL_CHART_DIR}}
        run: helm-docs

      - name: Configure commit signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.HXPS_GIT_COMMIT_SIGNING_PRIVATE_KEY }}
          GPG_PRIVATE_KEY_FINGERPRINT: ${{ secrets.HXPS_GIT_COMMIT_SIGNING_FINGERPRINT }}
          GIT_USERNAME: ${{ vars.HXPS_GIT_USERNAME }}
          GIT_USEREMAIL: ${{ vars.HXPS_GIT_EMAIL }}
        run: |
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --yes --pinentry-mode loopback --import
          git config --global user.name "$GIT_USERNAME"
          git config --global user.email "$GIT_USEREMAIL"
          git config --global user.signingkey "$GPG_PRIVATE_KEY_FINGERPRINT"
          git config --global commit.gpgsign true

      - name: Commit signed chart changes
        id: commit
        working-directory: ${{ env.FULL_CHART_DIR }}
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo "No chart changes to commit; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update docker image tags to $VERSION"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create propagation PR
        if: steps.commit.outputs.changed == 'true'
        working-directory: ${{ env.FULL_CHART_DIR}}
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          git push origin $FULL_CHART_PR_BRANCH
          gh pr create --fill --base $FULL_CHART_BASE_BRANCH --label updatebot --head $(git branch --show-current)

  notify:
    runs-on: ubuntu-latest
    needs:
      - propagate-helm
      - propagate-maven
    if: always() && failure() && github.event_name == 'push'
    steps:
      - name: Teams Notification
        uses: Alfresco/alfresco-build-tools/.github/actions/send-teams-notification@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          webhook-url: ${{ secrets.TEAMS_NOTIFICATION_WORKFLOW_WEBHOOK }}
