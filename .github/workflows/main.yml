name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - milestoned
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true

env:
  CLUSTER_NAME: activiti
  CLUSTER_DOMAIN: envalfresco.com
  GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  pre-checks:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.dependabot.outputs.result }}
      skip-tests: ${{ steps.check-skip-tests.outputs.result }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check dependabot build
        uses: Alfresco/alfresco-build-tools/.github/actions/github-require-secrets@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          dependabot-error-message: "This PR requires additional validation, please set the milestone to 'Validating' or ask a reviewer to approve it."
          none-error-message: "Fork PRs cannot be validated in this repository."
      - name: dependabot check
        id: dependabot
        if: ${{ github.event_name == 'push' }}
        uses: Alfresco/alfresco-build-tools/.github/actions/github-pr-check-metadata@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          gh-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          actor: "dependabot[bot]"
          label: github_actions
      - name: Check skip tests
        id: check-skip-tests
        uses: Alfresco/alfresco-build-tools/.github/actions/github-pr-check-metadata@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          gh-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          label: skip-tests
      - name: pre-commit
        uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          skip_checkout: true
      - name: Ensure SHA pinned actions
        uses: hyland/github-actions-ensure-sha-pinned-actions@7d494b6b53e71f75194d74b4dd890a2266d060b5 # v2.0.0

  # Computes the release/pre-release version once so every sharded build job
  # (and the downstream jobs) align on the exact same version.
  prepare:
    runs-on: ubuntu-latest
    needs: pre-checks
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    outputs:
      version: ${{ steps.update-pom-to-next-version.outputs.next-prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Setup Java JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # 5.2.0
        with:
          java-version: 25
          distribution: 'corretto'

      - name: Resolve override VERSION
        id: resolve-override-version
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          GITHUB_PR_NUMBER=PR-${{ github.event.pull_request.number }}
          echo "version=0.0.1-${GITHUB_PR_NUMBER}-SNAPSHOT" >> $GITHUB_OUTPUT

      - uses: Alfresco/alfresco-build-tools/.github/actions/update-pom-to-next-pre-release@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        id: update-pom-to-next-version
        with:
          version: ${{ steps.resolve-override-version.outputs.version }}

  build:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    needs:
      - pre-checks
      - prepare
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    strategy:
      # Each shard builds one docker image (and its service family) in parallel.
      # The "services" shard covers the remaining service modules that are not
      # backing a docker image so test coverage matches the previous single build.
      fail-fast: false
      matrix:
        include:
          - name: example-runtime-bundle
            paths: activiti-cloud-examples/example-runtime-bundle
            image: example-runtime-bundle
          - name: activiti-cloud-query
            paths: activiti-cloud-examples/activiti-cloud-query
            image: activiti-cloud-query
          - name: example-cloud-connector
            paths: activiti-cloud-examples/example-cloud-connector
            image: example-cloud-connector
          - name: activiti-cloud-identity-adapter
            paths: activiti-cloud-examples/activiti-cloud-identity-adapter
            image: activiti-cloud-identity-adapter
          - name: services
            paths: activiti-cloud-audit-service activiti-cloud-messages-service activiti-cloud-notifications-graphql-service activiti-cloud-acceptance-tests activiti-cloud-acceptance-scenarios
            image: ''
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup Java JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # 5.2.0
        with:
          java-version: 25
          distribution: 'corretto'

      - name: Align project version
        run: |
          echo "$VERSION" > VERSION
          mvn -B versions:set -DnewVersion=$VERSION -DprocessAllModules=true -DgenerateBackupPoms=false $MAVEN_CLI_OPTS

      - name: Enable testcontainers reuse option
        run: |
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties
          echo "TESTCONTAINERS_RYUK_DISABLED=true" >> $GITHUB_ENV

      # -pl on an aggregator does NOT include its submodules, so enumerate every
      # pom.xml under the shard paths to build all leaf modules (and their tests).
      - name: Resolve reactor modules
        id: modules
        run: |
          MODULES=$(for p in ${{ matrix.paths }}; do \
            find "$p" -name pom.xml -not -path '*/target/*' -exec dirname {} \; ; \
          done | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "modules=$MODULES" >> $GITHUB_OUTPUT

      - name: Maven Build and Test
        shell: bash
        run: |
          TEST_OPTS=""
          if [[ "${{ needs.pre-checks.outputs.skip-tests }}" == "true" ]]; then
            TEST_OPTS="-DskipTests=true"
            echo "::warning::Tests are being skipped due to 'skip-tests' label. This PR cannot be merged until the label is removed."
          fi
          mvn -DskipAcceptanceTests=true -DunitTests.parallel=true -T 1C install \
            -pl ${{ steps.modules.outputs.modules }} -am $TEST_OPTS $MAVEN_CLI_OPTS

      - name: Upload JaCoCo execution data
        if: ${{ needs.pre-checks.outputs.skip-tests != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-${{ matrix.name }}
          path: '**/target/jacoco.exec'
          if-no-files-found: ignore

      - name: Echo Longest Tests run
        shell: bash
        run: find . -name TEST-*.xml -exec grep -h testcase {} \; | awk -F '"' '{printf("%s#%s() - %.3fms\n", $4, $2, $6); }' | sort -n -k 3 | tail -20

      - name: Login to DockerHub
        if: ${{ matrix.image != '' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build docker image
        if: ${{ matrix.image != '' }}
        run: make docker/${{ matrix.image }}

      - name: Remove running docker containers
        run: docker rm -f $(docker ps -a -q)
        continue-on-error: true

  sonar:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - prepare
      - build
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      JACOCO_MERGED_FILE: ${{ github.workspace }}/target/jacoco-merged.exec
      MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup Java JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # 5.2.0
        with:
          java-version: 25
          distribution: 'corretto'

      - name: Align project version
        run: mvn -B versions:set -DnewVersion=$VERSION -DprocessAllModules=true -DgenerateBackupPoms=false $MAVEN_CLI_OPTS

      - name: Compile project for analysis
        run: mvn -T 1C -DskipTests -DskipAcceptanceTests=true install $MAVEN_CLI_OPTS

      - name: Download JaCoCo execution data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jacoco-*
          merge-multiple: true
          path: .

      - name: Merge JaCoCo execution files
        run: mvn -N jacoco:merge -Djacoco.destFile=${{ env.JACOCO_MERGED_FILE }} $MAVEN_CLI_OPTS

      - name: Generate coverage reports
        run: mvn jacoco:report -Djacoco.dataFile=${{ env.JACOCO_MERGED_FILE }} $MAVEN_CLI_OPTS

      - name: Run SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: mvn sonar:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=activiti -Dsonar.projectKey=Activiti_activiti-cloud -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco*/jacoco.xml $MAVEN_CLI_OPTS

  acceptance-tests:
    runs-on: ubuntu-latest
    if: ${{ needs.pre-checks.outputs.skip != 'true' && needs.pre-checks.outputs.skip-tests != 'true' }}
    # Per matrix cell: unique namespace + Helm profile. Images: build job → VERSION → update-chart → Helm (Serenity flow).
    needs:
      - pre-checks
      - prepare
      - build
    env:
      MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml
      ACTIVITI_CLOUD_FULL_CHART_RELEASE_BRANCH: develop
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Bundled preview Keycloak users — repo variables (usernames) + secrets (passwords).
      TESTUSER_USERNAME: ${{ vars.ACCEPTANCE_TESTUSER_USERNAME || 'testuser' }}
      TESTUSER_PASSWORD: ${{ secrets.ACCEPTANCE_TESTUSER_PASSWORD }}
      HRUSER_USERNAME: ${{ vars.ACCEPTANCE_HRUSER_USERNAME || 'hruser' }}
      HRUSER_PASSWORD: ${{ secrets.ACCEPTANCE_HRUSER_PASSWORD }}
      HRADMIN_USERNAME: ${{ vars.ACCEPTANCE_HRADMIN_USERNAME || 'hradmin' }}
      HRADMIN_PASSWORD: ${{ secrets.ACCEPTANCE_HRADMIN_PASSWORD }}
      PROCESSADMINUSER_USERNAME: ${{ vars.ACCEPTANCE_PROCESSADMINUSER_USERNAME || 'processadminuser' }}
      PROCESSADMINUSER_PASSWORD: ${{ secrets.ACCEPTANCE_PROCESSADMINUSER_PASSWORD }}
      TESTADMIN_USERNAME: ${{ vars.ACCEPTANCE_TESTADMIN_USERNAME || 'testadmin' }}
      TESTADMIN_PASSWORD: ${{ secrets.ACCEPTANCE_TESTADMIN_PASSWORD }}
    strategy:
      # One namespace per matrix cell (unique PREVIEW_NAME); parallel capped for shared cluster capacity.
      max-parallel: 4
      fail-fast: false
      matrix:
        messaging-broker: [rabbitmq, kafka]
        messaging-partitioned: [partitioned, non-partitioned]
        messaging-destinations: [default-destinations]
        include:
          - messaging-broker: kafka
            messaging-partitioned: partitioned
            messaging-destinations: override-destinations
          - messaging-broker: rabbitmq
            messaging-partitioned: non-partitioned
            messaging-destinations: pdb
          - messaging-broker: rabbitmq
            messaging-partitioned: prefix
            messaging-destinations: pdb
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup Java JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # 5.2.0
        with:
          java-version: 25
          distribution: 'corretto'

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.19.6

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.5.2

      - name: Set up rancher
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-rancher-cli@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          url: ${{ secrets.RANCHER2_URL }}
          access-key: ${{ secrets.RANCHER2_ACCESS_KEY }}
          secret-key: ${{ secrets.RANCHER2_SECRET_KEY }}
          context: ${{ env.CLUSTER_NAME }}

      - uses: ./.github/actions/setup-env-for-broker
        with:
          messaging-broker: ${{ matrix.messaging-broker }}
          messaging-partitioning-option: ${{ matrix.messaging-partitioned }}
          messaging-destinations-option: ${{ matrix.messaging-destinations }}
          version: ${{ needs.prepare.outputs.version }}

      - name: Cache Helm chart checkout
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .git/activiti-cloud-full-chart
          key: activiti-full-chart-${{ env.ACTIVITI_CLOUD_FULL_CHART_RELEASE_BRANCH }}-${{ needs.prepare.outputs.version }}

      - name: Delete preview for ${{ matrix.messaging-broker }}
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview') }}
        run: |
          kubectl delete ns $PREVIEW_NAME || true

      - name: Install release for ${{ matrix.messaging-broker }}
        run: bash scripts/ci/install-preview-release.sh

      - name: (kafka,partitioned) Checks that consumers can be a different number from partitions
        if: ${{ matrix.messaging-broker == 'kafka' && matrix.messaging-partitioned == 'partitioned' && matrix.messaging-destinations == 'default-destinations' }}
        run: bash scripts/ci/kafka-partitioned-consumer-check.sh

      - uses: ./.github/actions/check-service-health
        with:
          health-url: ${{ env.GATEWAY_PROTOCOL }}://${{ env.GATEWAY_HOST }}/identity-adapter-service/actuator/health

      - uses: ./.github/actions/prepare-preview-for-playwright

      - uses: ./.github/actions/check-service-health
        with:
          health-url: ${{ env.GATEWAY_PROTOCOL }}://${{ env.GATEWAY_HOST }}/rb/actuator/health

      - name: Export Playwright CI environment
        run: bash scripts/ci/export-playwright-ci-env.sh

      - name: Run Playwright Acceptance Tests
        uses: ./.github/actions/playwright-run
        with:
          script-command: "npm run test:all"

      - name: Delete Helm chart for ${{ matrix.messaging-broker }}
        if: always()
        run: |
          echo "Delete Helm release"
          make delete

  build-summary:
    runs-on: ubuntu-latest
    name: build summary
    if: ${{ always() && needs.pre-checks.outputs.skip != 'true' }}
    needs:
      - pre-checks
      - build
      - acceptance-tests
    steps:
      - name: Check build and acceptance-tests results
        if: >-
          ${{
              contains(needs.build.result, 'failure')
           || contains(needs.build.result, 'cancelled')
           || contains(needs.acceptance-tests.result, 'failure')
           || contains(needs.acceptance-tests.result, 'cancelled')
          }}
        run: |
          echo "Build or acceptance tests have failed or been cancelled. Exiting ..."
          exit 1

      - name: Check if tests were skipped
        shell: bash
        run: |
          if [[ "${{ needs.pre-checks.outputs.skip-tests }}" == "true" ]]; then
            echo "::error::This pull request cannot be merged. Remove the 'skip-tests' label to enable tests and merge."
            exit 1
          else
            echo "This pull request can be merged."
          fi

  delete-test-images:
    runs-on: ubuntu-latest
    if: ${{ needs.pre-checks.outputs.skip != 'true' }}
    needs:
      - pre-checks
      - prepare
      - acceptance-tests
      - build
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Delete Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          IS_PREVIEW: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview') }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ $IS_PREVIEW = true ] || [ $GITHUB_EVENT_NAME = "push" ]
          then
              echo "Skipping delete Docker images"
          else
              echo $VERSION > VERSION
              echo "Delete Docker images"
              make docker-delete-all
          fi

  publish:
    runs-on: ubuntu-latest
    needs:
      - pre-checks
      - prepare
      - build
      - delete-test-images
    if: ${{ github.event_name == 'push' && needs.pre-checks.outputs.skip != 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview')) }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Setup Java JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 25
          distribution: 'corretto'

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Update pom files to the new version
        run: mvn -B versions:set -DnewVersion=$VERSION -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Maven Deploy
        shell: bash
        run: mvn deploy -DskipTests ${{ env.MAVEN_CLI_OPTS}} ${{env.MAVEN_CLI_CONNECTION_OPTS}}
        env:
          MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml
          MAVEN_CLI_CONNECTION_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/git-commit-changes@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          username: ${{ secrets.BOT_GITHUB_USERNAME }}
          add-options: -u
          commit-message: "Release $VERSION"

      - name: Create release tag
        if: github.event_name == 'push'
        run: |
          git tag -fa $VERSION -m "Release version $VERSION"
          git push origin $VERSION

  propagate-maven:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
      - publish
    if: github.event_name == 'push'
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DEVELOPMENT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: Alfresco/alfresco-build-tools/.github/actions/jx-updatebot-pr@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          version: ${{ needs.prepare.outputs.version }}
          auto-merge: "true"
          labels: "be-propagation,${{ env.DEVELOPMENT_BRANCH }}"
          base-branch-name: ${{ env.DEVELOPMENT_BRANCH }}
          git-username: ${{ secrets.BOT_GITHUB_USERNAME }}
          git-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          git-author-name: ${{ secrets.BOT_GITHUB_USERNAME }}

  propagate-helm:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
      - publish
    if: github.event_name == 'push' && github.ref_name == 'develop'
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      FULL_CHART_DIR: full-chart
      FULL_CHART_BASE_BRANCH: develop
      FULL_CHART_PR_BRANCH: update-docker-images-${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ${{ env.FULL_CHART_DIR }}
          repository: Activiti/activiti-cloud-full-chart
          ref: ${{ env.FULL_CHART_BASE_BRANCH }}
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
      - name: Update image tags in Helm chart
        working-directory: ${{ env.FULL_CHART_DIR }}/charts/activiti-cloud-full-example
        run: |
          git checkout -b $FULL_CHART_PR_BRANCH
          yq -i e '.runtime-bundle.image.tag = env(VERSION)' values.yaml
          yq -i e '.activiti-cloud-query.image.tag = env(VERSION)' values.yaml
          yq -i e '.activiti-cloud-consumer.image.tag = env(VERSION)' values.yaml
          yq -i e '.activiti-cloud-connector.image.tag = env(VERSION)' values.yaml
          yq -i e '.activiti-cloud-identity-adapter.image.tag = env(VERSION)' values.yaml

      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-helm-docs@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
      - name: Update helm docs
        working-directory: ${{ env.FULL_CHART_DIR}}
        run: helm-docs

      - uses: Alfresco/alfresco-build-tools/.github/actions/git-commit-changes@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          username: ${{ secrets.BOT_GITHUB_USERNAME }}
          add-options: -u
          repository-directory: ${{ env.FULL_CHART_DIR}}
          commit-message: "Update docker image tags to $VERSION"

      - name: Create propagation PR
        working-directory: ${{ env.FULL_CHART_DIR}}
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          git push origin $FULL_CHART_PR_BRANCH
          gh pr create --fill --base $FULL_CHART_BASE_BRANCH --label updatebot --head $(git branch --show-current)

  notify:
    runs-on: ubuntu-latest
    needs:
      - propagate-helm
      - propagate-maven
    if: always() && failure() && github.event_name == 'push'
    steps:
      - name: Teams Notification
