name: Maven build (library modules)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      BOT_GITHUB_TOKEN:
        required: true
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true

env:
  MAVEN_CLI_OPTS: --show-version --no-transfer-progress --settings settings.xml

jobs:
  build:
    name: maven-build-library (${{ matrix.library-id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        library-id: [messages-graphql, audit]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - id: library
        name: Load library module config (${{ matrix.library-id }})
        shell: bash
        env:
          LIBRARY_ID: ${{ matrix.library-id }}
        run: |
          set -euo pipefail
          CONFIG="${GITHUB_WORKSPACE}/.github/ci/library-modules.json"
          if ! jq -e --arg id "${LIBRARY_ID}" '.[$id]' "${CONFIG}" >/dev/null; then
            echo "::error::Unknown library id: ${LIBRARY_ID}"
            exit 1
          fi
          modules="$(jq -r --arg id "${LIBRARY_ID}" '.[$id].mavenModules' "${CONFIG}")"
          echo "maven-modules=${modules}" >> "${GITHUB_OUTPUT}"

      - name: Write VERSION file
        shell: bash
        env:
          PROJECT_VERSION: ${{ inputs.version }}
        run: |
          echo "${PROJECT_VERSION}" > VERSION
          echo "VERSION=${PROJECT_VERSION}" >> "$GITHUB_ENV"

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-update-pom-version@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          version: ${{ inputs.version }}
          maven-cli-opts: ${{ env.MAVEN_CLI_OPTS }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-build@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        with:
          java-version: '25'
          java-distribution: 'corretto'
          reuse-testcontainers: 'true'
          maven-command: >-
            install -T 1C -Dskip.common.tests=true -DskipTests=true -DskipITs=true
            -pl ${{ steps.library.outputs.maven-modules }} -am
          m2-current-build-upload-name: m2-${{ matrix.library-id }}
          m2-cache-exclusion-pattern: org/activiti
          uploaded-artifacts-retention-days: '1'
