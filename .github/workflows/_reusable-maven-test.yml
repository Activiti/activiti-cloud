name: Maven test (docker images)

on:
  workflow_call:
    inputs:
      matrix-json:
        required: true
        type: string
      ref:
        required: true
        type: string
    secrets:
      BOT_GITHUB_TOKEN:
        required: true
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true

jobs:
  test:
    name: maven-test (${{ matrix.short-name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix-json) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-build@1d671f8f10336861c89c67be57c6648d98876103 # v18.19.0
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        with:
          java-version: '25'
          java-distribution: 'corretto'
          reuse-testcontainers: 'true'
          maven-command: >-
            verify -Dskip.common.tests=true -Dmaven.install.skip=true -Dswagger.skip
            -pl ${{ matrix.extra-modules }}${{ matrix.path }} -am
            ${{ matrix.test-maven-flags }} -U
          jacoco-report-name: jacoco-${{ matrix.short-name }}
          target-folder-upload-name: target-test-${{ matrix.short-name }}
          m2-cache-exclusion-pattern: org/activiti
          uploaded-artifacts-retention-days: '1'
