name: Maven test (docker images)

on:
  workflow_call:
    inputs:
      matrix-json:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      BOT_GITHUB_TOKEN:
        required: true
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true

jobs:
  test:
    name: maven-test (${{ matrix.short-name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(inputs.matrix-json) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Write VERSION file
        shell: bash
        env:
          PROJECT_VERSION: ${{ inputs.version }}
        run: |
          echo "${PROJECT_VERSION}" > VERSION
          echo "VERSION=${PROJECT_VERSION}" >> "$GITHUB_ENV"

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-update-pom-version@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          version: ${{ inputs.version }}

      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-build@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        with:
          java-version: '25'
          java-distribution: 'corretto'
          reuse-testcontainers: 'true'
          maven-command: >-
            verify -Dskip.common.tests=true -pl ${{ matrix.extra-modules }}${{ matrix.path }} -am
            ${{ matrix.test-maven-flags }} -U
          jacoco-report-name: jacoco-${{ matrix.short-name }}
          target-folder-upload-name: target-test-${{ matrix.short-name }}
          m2-current-build-upload-name: m2-test-${{ matrix.short-name }}
          m2-cache-exclusion-pattern: org/activiti
          uploaded-artifacts-retention-days: '1'
