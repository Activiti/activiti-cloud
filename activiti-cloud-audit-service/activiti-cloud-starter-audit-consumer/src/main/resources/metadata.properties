activiti.cloud.service.type=audit

# enable batching for generated SQL queries for Query and Audit event handlers for better performance
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# timeout queries that run longer than 3 minutes
spring.jpa.properties.jakarta.persistence.query.timeout=180000

#disables zipkin reporting
spring.zipkin.enabled=false
