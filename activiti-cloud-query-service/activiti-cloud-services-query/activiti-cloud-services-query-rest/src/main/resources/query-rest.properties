logging.level.org.hibernate.collection.spi.AbstractPersistentCollection=ERROR
activiti.features.query.task-count.cache.enabled=true
activiti.features.query.process-instance-count.cache.enabled=true

# JPA/Hibernate query timeout (in seconds)
# 120 seconds (2 minutes) for individual query timeout to fail fast
spring.jpa.properties.hibernate.query.timeout=120000

# Enable query timeout enforcement at the session level
spring.jpa.properties.org.hibernate.jdbc.fetch_size=100

# Configure Hikari connection pool for query operations
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
