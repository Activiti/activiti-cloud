# Pushed counts (feature: query.pushed-counts), broker-side of the query-rest relay.
# Fan-out (no consumer group): every query-rest instance relays only to its own locally-connected
# sockets, so every instance must receive every message, not a share of them - matching
# subscriberRegistryConsumer's own fan-out reasoning in query-messaging.properties.
spring.cloud.stream.bindings.countConsumer.destination=${ACT_QUERY_COUNTS_DEST:pushedCounts}
spring.cloud.stream.bindings.countConsumer.contentType=${ACT_QUERY_COUNTS_CONTENT_TYPE:application/json}
