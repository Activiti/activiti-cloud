# Pushed-counts subscriber registry - query-rest producer side. Feature: query.pushed-counts.
# The registry destination is a fan-out (NO consumer group) so every query-consumer instance
# receives every query-rest instance's REGISTERED / UNREGISTERED / HEARTBEAT / SNAPSHOT.
#
# subscriberRegistryResyncResponder consumes the consumer's RESYNC_REQUEST off the shared
# destination and replies with a SNAPSHOT. Outbound messages are produced through StreamBridge to
# the same destination, so only the input binding is declared here. The destination is shared with
# the consumer via ACT_QUERY_SUBSCRIBER_REGISTRY_DEST so both sides address the same exchange.
#
# spring.cloud.function.definition is merged (not overridden) with any other functional bindings in
# a joint rest+consumer deployment by FunctionBindingPropertySource.
spring.cloud.function.definition=subscriberRegistryResyncResponder
spring.cloud.stream.bindings.subscriberRegistryResyncResponder-in-0.destination=${ACT_QUERY_SUBSCRIBER_REGISTRY_DEST:subscriberRegistry}
spring.cloud.stream.bindings.subscriberRegistryResyncResponder-in-0.contentType=application/json
