activiti.cloud.service.type=query

# enable batching for generated SQL queries for Query and Audit event handlers for better performance
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Query timeout protection (5 minutes = 300 seconds for statement timeout)
# This allows the database to kill long-running queries automatically
spring.jpa.properties.hibernate.jdbc.statement_cache_size=250
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000

# HikariCP leak detection threshold (30 seconds)
spring.datasource.hikari.leak-detection-threshold=30000

#disables zipkin reporting
spring.zipkin.enabled=false
