rules:
  - id: disallow-component-scan
    languages:
      - java
    message: Spring annotation ComponentScan usage is forbidden.
    pattern: |
      @ComponentScan(...)
    severity: ERROR

  - id: java-no-lombok-annotations
    message: Lombok annotations are not allowed
    severity: ERROR
    languages: [java]
    pattern-either:
      # Fully qualified Lombok annotations, e.g. @lombok.Data(...)
      - pattern: |
          @lombok.$ANNOTATION(...)
      # Fully qualified Lombok annotations from subpackages, e.g. @lombok.experimental.Accessors(...)
      - pattern: |
          @lombok.$SUBPKG.$ANNOTATION(...)
      # Fully qualified Lombok annotations from nested subpackages, e.g. @lombok.extern.slf4j.Slf4j(...)
      - pattern: |
          @lombok.$SUBPKG1.$SUBPKG2.$ANNOTATION(...)
      # Typical Lombok usage: imported annotation and simple-name usage, e.g.:
      #   import lombok.Data;
      #   @Data(...)
      - patterns:
          - pattern: |
              @$ANNOTATION(...)
          - pattern-inside: |
              import lombok.$ANNOTATION;
      # Typical Lombok usage from subpackages, e.g.:
      #   import lombok.experimental.Accessors;
      #   @Accessors(...)
      - patterns:
          - pattern: |
              @$ANNOTATION(...)
          - pattern-inside: |
              import lombok.$SUBPKG.$ANNOTATION;
      # Typical Lombok usage from nested subpackages, e.g.:
      #   import lombok.extern.slf4j.Slf4j;
      #   @Slf4j(...)
      - patterns:
          - pattern: |
              @$ANNOTATION(...)
          - pattern-inside: |
              import lombok.$SUBPKG1.$SUBPKG2.$ANNOTATION;
      # Lombok imports (non-static) - covers all subpackages
      - pattern-regex: "^\\s*import\\s+lombok\\.(?:[A-Za-z_][A-Za-z0-9_]*\\.)*(?:[A-Za-z_][A-Za-z0-9_]*|\\*)\\s*;$"
      # Lombok static imports - covers all subpackages
      - pattern-regex: "^\\s*import\\s+static\\s+lombok\\.(?:[A-Za-z_][A-Za-z0-9_]*\\.)*(?:[A-Za-z_][A-Za-z0-9_]*|\\*)\\s*;$"

  - id: pom-no-lombok
    message: Lombok dependency detected in pom.xml
    severity: ERROR
    languages: [xml]
    pattern-regex: "<groupId>\\s*org\\.projectlombok"

  - id: require-rabbitmq-cleanup-listener-with-rabbitmq-initializer
    languages: [java]
    message: |
      Test classes annotated with @SpringBootTest that import RabbitMQContainerApplicationInitializer must also import
      RabbitMQQueuesCleanupTestExecutionListener and include it in @TestExecutionListeners
      to prevent RabbitMQ queue pollution between tests.
    severity: ERROR
    patterns:
      - pattern-inside: |
          import org.activiti.cloud.services.test.containers.RabbitMQContainerApplicationInitializer;
          ...
      - pattern: |
          @SpringBootTest(...)
          class $CLASS { ... }
      - pattern-not-inside: |
          import org.activiti.cloud.services.test.containers.RabbitMQQueuesCleanupTestExecutionListener;
          ...

  - id: disallow-jackson2-imports
    languages: [java]
    message: |
      Usage of Jackson 2 (com.fasterxml.jackson) is forbidden. Use Jackson 3 (tools.jackson) instead.
    severity: ERROR
    pattern-regex: "com\\.fasterxml\\.jackson\\.(?!annotation\\b)"
    paths:
      exclude:
        - "*/activiti-cloud-services-swagger/*"
        - "**/JsonSchemaGeneratorTest.java"
        - "**/RuntimeFeignConfiguration.java"
