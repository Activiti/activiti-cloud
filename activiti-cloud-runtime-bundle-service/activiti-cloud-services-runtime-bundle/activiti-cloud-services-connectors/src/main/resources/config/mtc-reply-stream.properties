# MTC reply consumer - receives integration results from the shared connector
spring.cloud.stream.bindings.mtcResultsConsumer.destination=mtc-connector-reply-exchange
spring.cloud.stream.bindings.mtcResultsConsumer.contentType=application/json
spring.cloud.stream.bindings.mtcResultsConsumer.group=mtc-reply-${ACT_RB_APP_NAME:${spring.application.name}}

spring.cloud.stream.rabbit.bindings.mtcResultsConsumer.consumer.prefix=
spring.cloud.stream.rabbit.bindings.mtcResultsConsumer.consumer.queueNameGroupOnly=true
spring.cloud.stream.rabbit.bindings.mtcResultsConsumer.consumer.bindQueue=true
spring.cloud.stream.rabbit.bindings.mtcResultsConsumer.consumer.declareExchange=true
spring.cloud.stream.rabbit.bindings.mtcResultsConsumer.consumer.exchangeType=topic
