spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none

spring.runtime-bundle.liquibase.change-log=classpath:config/runtime-bundle/liquibase/master.xml
spring.runtime-bundle.liquibase.database-change-log-table=DATABASECHANGELOG_RUNTIMEBUNDLE
spring.runtime-bundle.liquibase.database-change-log-lock-table=DATABASECHANGELOGLOCK_RUNTIMEBUNDLE
