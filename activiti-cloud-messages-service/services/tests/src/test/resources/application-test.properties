# Test configuration to prevent FunctionTypeUtils conflicts
spring.main.lazy-initialization=true
spring.cloud.function.enabled=false
spring.cloud.function.scan.packages=
spring.cloud.function.definition=
spring.cloud.stream.function.bindings=
spring.cloud.stream.source=
spring.cloud.stream.processor=
spring.cloud.stream.sink=

# Disable auto-configuration that might conflict with FunctionTypeUtils
spring.autoconfigure.exclude=org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration,org.springframework.cloud.stream.config.StreamConfiguration

# Messaging configuration
spring.cloud.stream.default-binder=test
spring.cloud.stream.bindings.messageConnectorInput.content-type=application/json
spring.cloud.stream.bindings.messageConnectorOutput.content-type=application/json

# Application properties
spring.application.name=rb
activiti.cloud.application.name=default-app

# Logging for debugging
logging.level.org.springframework.cloud.function=WARN
logging.level.org.springframework.cloud.stream=WARN
logging.level.org.activiti.cloud.common.messaging=DEBUG
