# Query Timeout Configuration Override Examples
# 
# This file shows how to override the default query timeout settings
# for different environments and use cases.
#
# Place these properties in your application.properties or application-{profile}.properties
# or set them as environment variables

# ============================================================================
# DEVELOPMENT ENVIRONMENT
# ============================================================================
# Development profile: dev
# Use: application-dev.properties

#spring.jpa.properties.hibernate.query.timeout=300000
#spring.datasource.hikari.maximum-pool-size=5
#spring.datasource.hikari.minimum-idle=2
#spring.datasource.hikari.connection-timeout=60000

# ============================================================================
# TESTING ENVIRONMENT
# ============================================================================
# Test profile: test
# Use: application-test.properties

#spring.jpa.properties.hibernate.query.timeout=300000
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.minimum-idle=2

# ============================================================================
# PRODUCTION ENVIRONMENT
# ============================================================================
# Production profile: prod
# Use: application-prod.properties

#spring.jpa.properties.hibernate.query.timeout=300000
#spring.datasource.hikari.maximum-pool-size=50
#spring.datasource.hikari.minimum-idle=10
#spring.datasource.hikari.connection-timeout=30000
#spring.datasource.hikari.max-lifetime=1800000
#spring.datasource.hikari.idle-timeout=600000
#spring.datasource.hikari.leak-detection-threshold=30000

# ============================================================================
# ENVIRONMENT VARIABLES (if using Spring Cloud Config or K8s)
# ============================================================================
# Set via environment variables with Spring property conversion:
#
# SPRING_JPA_PROPERTIES_HIBERNATE_QUERY_TIMEOUT=300000
# SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=50
# SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT=30000
#
# For PostgreSQL statement_timeout in connection string:
# spring.datasource.url=jdbc:postgresql://host:5432/db?statement_timeout=300000

# ============================================================================
# HIGH LOAD SCENARIO
# ============================================================================
# When expecting very high concurrent load:

#spring.jpa.properties.hibernate.query.timeout=180000
#spring.datasource.hikari.maximum-pool-size=100
#spring.datasource.hikari.minimum-idle=20
#spring.datasource.hikari.connection-timeout=10000
#spring.datasource.hikari.leak-detection-threshold=15000

# ============================================================================
# LOW LATENCY SCENARIO
# ============================================================================
# When you need fast fail-fast behavior:

#spring.jpa.properties.hibernate.query.timeout=60000
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.connection-timeout=15000
#spring.datasource.hikari.leak-detection-threshold=10000

# ============================================================================
# ADMIN ENDPOINT SPECIFIC TIMEOUT
# ============================================================================
# Note: Currently not implemented - all endpoints use same timeout
# Future enhancement: use different timeout for /admin/* endpoints
#
# Proposed configuration:
#spring.jpa.properties.hibernate.query.timeout.admin=300000
#spring.jpa.properties.hibernate.query.timeout.user=300000
