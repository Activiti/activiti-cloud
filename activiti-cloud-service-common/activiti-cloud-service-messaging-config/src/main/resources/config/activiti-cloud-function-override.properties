# Activiti Cloud Messaging Configuration Properties
# Force usage of custom FunctionTypeUtils implementation
activiti.cloud.function.type.utils.override=true
activiti.cloud.function.type.utils.class=org.activiti.cloud.common.messaging.util.FunctionTypeUtils

# Spring Cloud Function Auto-Configuration Exclusions
# These exclusions prevent conflicts with our custom FunctionTypeUtils implementation
spring.autoconfigure.exclude=\
  org.springframework.cloud.function.context.config.FunctionConfiguration,\
  org.springframework.cloud.function.context.catalog.FunctionCatalogConfiguration
